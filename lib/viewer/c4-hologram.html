<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forma · C4 Hologram</title>
<style>
:root{color-scheme:light;
 --bg:#050d14; --grid:rgba(62,231,255,.04); --halo:rgba(62,231,255,.10);
 --cyan:#3ee7ff; --sec:#6fa8bc; --ter:#4c7f94; --ter2:oklch(58.3% 0.065 229); --nm:#bfe9f7;
 --stagebg:rgba(4,12,19,.72); --stageborder:#143547; --nodebg:rgba(8,26,38,.92); --detailbg:rgba(6,20,30,.97);
 --border:#1e4a5e; --done:#2fe08a; --prog:#ffc74d; --next:#3ee7ff; --plan:oklch(49.3% 0.063 234); --planTxt:#7fb3c6; --prob:#ff5d5d; --unk:#7d8f99;
 --edge:#2b6e8a; --edgeplan:oklch(49.3% 0.056 233); --elbl:oklch(58.3% 0.081 229); --ddtxt:#7fb3c6; --now:#cfeefb; --tgt:#8fd8ec; --src:#4fbf8d;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"SF Mono",Menlo,Consolas,ui-monospace,monospace;background:var(--bg);color:var(--nm);overflow-x:hidden}
#wrap{padding:14px 18px 26px;min-height:100vh;background:
 radial-gradient(ellipse at 50% -10%,var(--halo),transparent 55%),
 repeating-linear-gradient(0deg,transparent,transparent 39px,var(--grid) 40px),
 repeating-linear-gradient(90deg,transparent,transparent 39px,var(--grid) 40px)}
h1{font-size:16px;letter-spacing:.16em;color:var(--cyan);text-shadow:0 0 14px rgba(62,231,255,.7);text-transform:uppercase}
.sub{font-size:10.5px;color:var(--sec);margin-top:3px}
.top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.ctrls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#legacytime{display:inline-flex;gap:8px}
button,select{font:inherit;font-size:10.5px;letter-spacing:.09em;cursor:pointer;border-radius:6px;padding:6px 12px;
 background:transparent;border:1px solid var(--border);color:var(--sec)}
button:hover,select:hover{background:rgba(62,231,255,.10);color:var(--cyan)}
button.on{background:rgba(62,231,255,.18);color:var(--cyan);border-color:var(--cyan);text-shadow:0 0 8px rgba(62,231,255,.8)}
#back{border-color:var(--cyan);color:var(--cyan)}
#back[disabled]{opacity:.28;cursor:default;border-color:var(--border);color:var(--ter)}
select#skin option{background:#08202e;color:var(--nm)}
#timeline{display:none;margin:10px 0 8px;padding:9px 10px 7px;border:1px solid var(--stageborder);border-radius:9px;background:var(--stagebg)}
#timeline-track{display:flex;align-items:flex-start;position:relative;overflow-x:auto;padding-bottom:2px}
#timeline-track:before{content:"";position:absolute;left:28px;right:28px;top:7px;height:1px;background:var(--border)}
.cpstep{position:relative;z-index:1;flex:1 0 118px;min-width:118px;border:0;padding:0 5px;background:transparent;text-align:center;color:var(--ter);font-size:9px;letter-spacing:.06em}
.cpstep:hover{background:transparent;color:var(--nm)}
.cpstep .dot{display:block;width:15px;height:15px;margin:0 auto 5px;border:2px solid var(--border);background:var(--bg);border-radius:50%}
.cpstep .cpbadge{display:block;margin-top:2px;color:var(--ter2);font-size:8px;letter-spacing:.02em;white-space:normal}
.cpstep.real .dot{border-color:var(--done);background:var(--done)}
.cpstep.active{color:var(--cyan)}
.cpstep.active .dot{border-color:var(--cyan);background:var(--bg);box-shadow:0 0 10px rgba(62,231,255,.8)}
#checkpoint-summary{text-align:right;color:var(--ter2);font-size:8.5px;letter-spacing:.08em;margin-top:5px;min-height:11px}
#checkpoint-summary b{color:var(--cyan);font-weight:600}
#crumb{font-size:11px;color:var(--sec);margin:8px 0}
#crumb .agg{float:right;color:var(--ter2);letter-spacing:.05em}
#crumb .agg i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 8px;vertical-align:baseline}
#crumb .agg b{color:var(--nm)}
#crumb b{color:var(--cyan)}
#crumb a{color:#8fd8ec;cursor:pointer}
#crumb a:hover{text-decoration:underline}
#stamp{font-size:9.5px;color:var(--ter2);margin-bottom:6px}
#stage{position:relative;width:100%;height:74vh;min-height:520px;border:1px solid var(--stageborder);border-radius:12px;background:var(--stagebg);overflow:hidden}
svg{width:100%;height:100%;display:block}
.nd{cursor:grab}
.nd.grabbing{cursor:grabbing}
.nd rect{fill:var(--nodebg);stroke-width:1.5;transition:filter .2s}
.nd text{font-family:inherit;pointer-events:none}
.nd .tt{font-size:11.5px;font-weight:700;letter-spacing:.03em}
.nd .kk{font-size:7.6px;letter-spacing:.14em;fill:var(--ter)}
.nd .dd{font-size:9px;fill:var(--ddtxt)}
.nd .pp{font-size:9px;font-weight:700}
.nd:hover rect{filter:brightness(1.32)}
.nd.drill .plus{font-size:9px;fill:var(--cyan);letter-spacing:.1em}
.nd .drillhit{fill:transparent;stroke:none;pointer-events:auto;cursor:zoom-in}
.nd .drillhit:hover{fill:rgba(62,231,255,.12)}
.s-done rect{stroke:var(--done);filter:drop-shadow(0 0 7px rgba(47,224,138,.55))}
.s-done .tt,.s-done .pp{fill:var(--done)}
/* The hollow green the legend has promised since #38: a done a repo document DECLARES is not a
   done a closed issue PROVES, and until now the canvas drew them identically. Hollow = the glow
   comes off, which is exactly what the legend swatch says (filled pill vs outline).
   ponytail: the blueprint skin zeroes every filter, so there the two greens still read alike —
   upgrade path is a second, skin-independent mark if anyone actually presents in blueprint. */
.s-done.decl rect{filter:none}
.s-prog rect{stroke:var(--prog);filter:drop-shadow(0 0 7px rgba(255,199,77,.5))}
.s-prog .tt,.s-prog .pp{fill:var(--prog)}
.s-next rect{stroke:var(--next);stroke-width:2.2;filter:drop-shadow(0 0 11px rgba(62,231,255,.75))}
.s-next .tt,.s-next .pp{fill:var(--next)}
.s-plan rect{stroke:var(--plan);stroke-dasharray:5 4}
.s-plan .tt,.s-plan .pp{fill:var(--planTxt)}
.s-prob rect{stroke:var(--prob);filter:drop-shadow(0 0 8px rgba(255,93,93,.6))}
.s-prob .tt,.s-prob .pp{fill:var(--prob)}
/* NO dash. legHint teaches the reader that a dashed box is `da costruire`, and wearing that dash
   made "nobody has ruled on this" read as "this does not exist" — on a repo where the module was
   right there. Not-ruled is now a plain grey outline: no dash (planned), no glow (done). */
.s-unk rect{stroke:var(--unk)}
.s-unk .tt,.s-unk .pp{fill:var(--unk)}
.nd.delta rect{stroke:var(--cyan)!important;stroke-width:2.3!important;filter:drop-shadow(0 0 12px rgba(62,231,255,.72))!important}
.nd.delta .tt{fill:var(--cyan)!important}
.mode-t .nd rect{stroke:var(--next)!important;stroke-dasharray:none!important;filter:drop-shadow(0 0 8px rgba(62,231,255,.5))!important}
.mode-t .nd .tt,.mode-t .nd .pp{fill:var(--next)!important}
.edge{stroke:var(--edge);stroke-width:1.3;fill:none;marker-end:url(#ar);cursor:help}
.edge.flow{stroke-dasharray:5 7;animation:dash 1.1s linear infinite}
.edge.inferred{stroke-dasharray:1 3;opacity:.5}
.edge.plan{stroke:var(--edgeplan);stroke-dasharray:3 6;opacity:.6;marker-end:url(#arp)}
.edge.hot{stroke:var(--cyan);stroke-width:2.6;opacity:1}
.edge.delta{stroke:var(--cyan);stroke-width:2.5;opacity:1;filter:drop-shadow(0 0 4px rgba(62,231,255,.7))}
/* A level past the label threshold is a hairball, and no layout saves it: on a real Go repo 172 of
   189 arrows cross a box that is not one of their endpoints, and that stays 85-91% at EVERY grid
   shape tried. Only drawing less helps. They stop competing with the names — structure survives as
   texture — and hover still brings one arrow back to full strength, which is where its label is. */
svg.dense .edge{stroke-width:.9;opacity:.26}
svg.dense .edge.flow{animation:none;stroke-dasharray:none}
svg.dense .edge.hot{opacity:1;stroke-width:2.6}
.edgehit{stroke:transparent;stroke-width:14;fill:none;cursor:help}
.elbl{font-size:8.2px;fill:var(--elbl);letter-spacing:.04em;pointer-events:none;
 paint-order:stroke;stroke:var(--stagebg);stroke-width:3px;stroke-linejoin:round}
@keyframes dash{to{stroke-dashoffset:-24}}
.nd.pulse rect{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{0%,100%{filter:drop-shadow(0 0 8px rgba(62,231,255,.5))}50%{filter:drop-shadow(0 0 18px rgba(62,231,255,.95))}}
@keyframes svgin{from{opacity:0;transform:scale(.975)}to{opacity:1;transform:none}}
@keyframes ndin{from{opacity:0}to{opacity:1}}
#stage.anim svg{animation:svgin .34s cubic-bezier(.2,.7,.2,1) both;transform-origin:50% 44%}
#stage.anim .nd{animation:ndin .55s ease both}
@media(prefers-reduced-motion:reduce){#stage.anim svg,#stage.anim .nd{animation:none}}
#etip{position:absolute;pointer-events:none;display:none;z-index:6;background:var(--detailbg);border:1px solid var(--border);
 color:var(--nm);font-size:10px;letter-spacing:.03em;padding:3px 8px;border-radius:5px;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.45)}
#legend{display:flex;gap:13px;font-size:9.5px;color:var(--sec);margin:10px 0 0;flex-wrap:wrap}
#legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;box-sizing:border-box}
.hint{color:var(--ter2)}
#detail{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:13px;background:var(--detailbg);display:none}
#detail h3{color:var(--cyan);font-size:12.5px;margin-bottom:8px;letter-spacing:.05em}
#detail h3 .cat{color:var(--ter);font-size:9px;letter-spacing:.12em}
.row{margin-bottom:7px;font-size:10.5px;line-height:1.5}
.lbl{color:var(--ter2);font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;display:block}
.func{color:#dff4fc}.now{color:var(--now)}.tgt{color:var(--tgt)}.src{color:var(--src);font-size:9.5px}
.cl{float:right;color:var(--sec);cursor:pointer;font-size:10px}
#err{color:var(--prob);font-size:11px;padding:14px}
/* PRINT / EXPORT menu */
.menuwrap{position:relative}
#pmenu{position:absolute;right:0;top:calc(100% + 4px);z-index:9;display:none;flex-direction:column;min-width:150px;
 background:var(--detailbg);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
#pmenu.open{display:flex}
#pmenu button{border:none;background:transparent;text-align:left;width:100%;border-radius:5px;padding:7px 10px;color:var(--sec)}
#pmenu button:hover{background:rgba(62,231,255,.12);color:var(--cyan)}
/* catalogue (collapsed homogeneous group) node */
.nd.cat rect{stroke-dasharray:2 3}
.nd.cat .plus{fill:var(--sec)}
/* detail LIST variant (catalogue roster) */
#detail .rostersearch{width:100%;font:inherit;font-size:10.5px;margin:2px 0 10px;padding:6px 9px;border-radius:6px;
 background:transparent;border:1px solid var(--border);color:var(--nm)}
#detail .roster{max-height:44vh;overflow-y:auto;border-top:1px solid var(--border)}
#detail .ritem{padding:7px 2px 7px 4px;border-bottom:1px solid rgba(30,74,94,.4);display:block}
#detail .ritem .rn{color:#dff4fc;font-size:11px;font-weight:700}
#detail .ritem .rp{float:right;color:var(--sec);font-size:9px;letter-spacing:.08em}
#detail .ritem .rd{color:var(--ddtxt);font-size:9.5px;line-height:1.45;display:block;margin-top:2px;clear:both}
#detail .rempty{color:var(--ter2);font-size:10px;padding:10px 4px}
@media print{
 body{background:#fff}
 #wrap{background:none;padding:0}
 .ctrls,#timeline,#legend,.sub,#etip,#pmenu{display:none!important}
 #stage{border:1px solid #999;height:auto;min-height:0}
 #stage svg{height:70vh}
}
/* blueprint is the skin the Control Room embeds, so it is NOT a look of its own: it is the
   briefing's own measured light palette, mapped onto this viewer's token names. Before, it was a
   cold blue-grey inside a warm briefing, which read as two applications stapled together — and the
   ponytail note above records that its statuses were indistinguishable there. They now carry the
   same deliberate lightness separation as everywhere else, verified by scripts/palette.mjs.
   The `holo` skin above keeps its own identity: it is the standalone explorer, a different artifact
   with a different audience. */
html[data-skin="blueprint"]{--bg:oklch(97.4% 0.006 75);--grid:oklch(54.2% 0.169 255 / 0.10);--halo:oklch(54.2% 0.169 255 / 0.08);
 --cyan:oklch(54.2% 0.169 255);--sec:oklch(54.0% 0.013 72);--ter:oklch(54.0% 0.013 72);--ter2:oklch(54.0% 0.013 72);--nm:oklch(22.0% 0.009 75);
 --stagebg:oklch(99.5% 0.005 78);--stageborder:oklch(88.0% 0.010 82);--nodebg:oklch(99.5% 0.005 78);--detailbg:oklch(99.5% 0.005 78);--border:oklch(88.0% 0.010 82);
 --done:oklch(52.9% 0.141 151);--prog:oklch(44.4% 0.094 73);--next:oklch(54.2% 0.169 255);--plan:oklch(63.3% 0.013 80);--planTxt:oklch(54.0% 0.013 72);--prob:oklch(35.5% 0.144 25);--unk:oklch(63.3% 0.013 80);
 --edge:oklch(63.3% 0.013 80);--edgeplan:oklch(63.3% 0.013 80);--elbl:oklch(54.0% 0.013 72);--ddtxt:oklch(54.0% 0.013 72);--now:oklch(22.0% 0.009 75);--tgt:oklch(54.2% 0.169 255);--src:oklch(52.9% 0.141 151)}
html[data-skin="blueprint"] h1{text-shadow:none}
html[data-skin="blueprint"] .s-done rect,html[data-skin="blueprint"] .s-prog rect,html[data-skin="blueprint"] .s-next rect,html[data-skin="blueprint"] .s-prob rect{filter:none}
html[data-skin="blueprint"] .nd.pulse rect{animation:none}
html[data-skin="blueprint"] button.on{text-shadow:none}
html[data-skin="blueprint"] .nd.delta rect,html[data-skin="blueprint"] .edge.delta{filter:none}
</style>
</head>
<body>
<div id="wrap">
 <div class="top">
  <div><h1 id="title">Forma · C4 Hologram</h1>
   <div class="sub" id="subhelp"></div></div>
  <div class="ctrls">
   <button id="back" type="button" disabled></button>
   <span id="legacytime"><button id="bnow" class="on" type="button"></button>
   <button id="btgt" type="button"></button></span>
   <button id="brf" type="button"></button>
   <button id="blbl" type="button"></button>
   <button id="brl" type="button"></button>
   <span class="menuwrap">
    <button id="pexp" type="button" aria-haspopup="true" aria-expanded="false"></button>
    <span id="pmenu" role="menu">
     <button id="pexpSvg" type="button" role="menuitem"></button>
     <button id="pexpPng" type="button" role="menuitem"></button>
     <button id="pexpLayout" type="button" role="menuitem"></button>
     <button id="pexpPrint" type="button" role="menuitem"></button>
    </span>
   </span>
   <select id="skin" title="skin"></select>
  </div>
 </div>
 <nav id="timeline">
  <div id="timeline-track"></div>
  <div id="checkpoint-summary"></div>
 </nav>
 <div id="crumb"></div>
 <div id="stamp"></div>
 <div id="stage"><div id="etip"></div><div id="err" style="display:none"></div></div>
 <div id="legend">
  <span><i style="background:#2fe08a"></i><span id="lg-done"></span></span>
  <!-- Same colour, hollow: a green derived from a repo document saying it is finished is not the
       same evidence as a green from a closed issue, and the legend is where a reader learns that
       one mark means two things. -->
  <span><i style="border:1.5px solid #2fe08a"></i><span id="lg-decl"></span></span>
  <span><i style="background:#ffc74d"></i><span id="lg-prog"></span></span>
  <span><i style="background:#3ee7ff"></i><span id="lg-next"></span></span>
  <span><i style="background:#2d5a72"></i><span id="lg-plan"></span></span>
  <span><i style="background:#ff5d5d"></i><span id="lg-prob"></span></span>
  <span><i style="background:#7d8f99"></i><span id="lg-unk"></span></span>
  <span id="lg-checkpoint-wrap" style="display:none"><i style="border:1.5px solid #3ee7ff"></i><span id="lg-checkpoint"></span></span>
  <span class="hint" id="lg-hint"></span>
 </div>
 <div id="detail"></div>
</div>

 }
};
var LANG="en", STR=STRINGS.en;
function pickLang(model){
 var q=null;try{q=new URLSearchParams(location.search).get("lang");}catch(e){}
 var cand=q||window.__C4_LANG__||(model&&model.meta&&model.meta.lang)||"en";
 cand=String(cand).toLowerCase().slice(0,2);
 return STRINGS[cand]?cand:"en";
}
var CATALOG_THRESHOLD=24; // group of same-category siblings above this collapses to one catalogue node
var LABEL_AUTO_MAX=14;    // above this many arrows in the current level, fixed labels would knot the view
var LABELS=null;          // null = auto (by arrow count); true/false = user override for this session
var SKINS=[["holo","◆ holo"],["blueprint","▭ blueprint"]], SKIN_IDS=["holo","blueprint"];
var STMAP={done:"done","in-progress":"prog",next:"next",planned:"plan",problem:"prob",unknown:"unk"};
// The per-level tally. The mean is over the nodes that CARRY a completion, and it reports how many
// those were: on a real Go repo, 25 containers at 100% next to 28 nobody has ruled on rendered as
// "progress 100%" — the invented green this tool exists to kill, in the one number a stakeholder
// reads first. Dividing by every child instead would be the mirror lie: a node with no verdict is
// not 0% done, which is exactly why `gen` refuses to write a completion nobody curated. So the
// percentage keeps its honest denominator and shows it.
//
// It counts UNITS, not boxes: grouping is the only cure for a 53-box wall, and the invariant that
// makes grouping safe is that it must not change this line. The same repo read 25/53 flat and 2/6
// once six domains were curated over it — the act of drawing fewer boxes silently deleted 23
// verdicts, in the number a stakeholder reads first.

 $("timeline").addEventListener("click",function(ev){var b=ev.target;while(b&&b!==$("timeline")&&!(b.getAttribute&&b.getAttribute("data-checkpoint")))b=b.parentNode;
  if(b&&b!==$("timeline"))setCheckpoint(b.getAttribute("data-checkpoint"),true,true);});
 $("brf").addEventListener("click",function(){
  // Served model ⇒ actually re-read it (a `forma verify` run in the terminal shows up here without
  // losing the level, the layout or the mode). Injected/offline ⇒ re-stamp, and say why.
  if(!FETCHED){stamp(STR.staticSrc);return;}
  fetch("./c4-model.json?ts="+(new Date()).getTime()).then(function(r){return r.json();})
   .then(function(m){if(m&&m.nodes&&m.nodes.length)loadModel(m,true);else stamp(STR.staticSrc);})
   .catch(function(){stamp(STR.staticSrc);});
 });
 $("blbl").addEventListener("click",function(){LABELS=!($("blbl").className==="on");draw(false);});
 $("brl").addEventListener("click",function(){delete POS[keyOf()];draw(true);});
 $("skin").innerHTML=SKINS.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>';}).join("");
 $("skin").addEventListener("change",function(e){setSkin(e.target.value);});
 wireExport();
}
// ---- i18n: apply every static UI string from STR ----
function applyStrings(){
 function set(id,txt){var e=$(id);if(e)e.textContent=txt;}
 set("subhelp",STR.subhelp);set("back",STR.back);set("bnow",STR.now);set("btgt",STR.tgt);
 set("brf",STR.reverify);set("brl",STR.resetLayout);var brl=$("brl");if(brl)brl.title=STR.resetLayoutTitle;
 set("blbl",STR.labels);var bl=$("blbl");if(bl)bl.title=STR.labelsTitle;
 set("pexp",STR.printExport);set("pexpSvg",STR.exportSvg);set("pexpPng",STR.exportPng);
 set("pexpLayout",STR.exportLayout);set("pexpPrint",STR.print);
 set("lg-done",STR.legDone);set("lg-decl",STR.legDecl);set("lg-prog",STR.legProg);set("lg-next",STR.legNext);
 set("lg-plan",STR.legPlan);set("lg-prob",STR.legProb);set("lg-unk",STR.legUnk);set("lg-checkpoint",STR.legCheckpoint);set("lg-hint",STR.legHint);
}
// ---- FEATURE #2: PRINT / EXPORT (all client-side, offline) ----
function exportBaseName(){
 var repo=(M&&M.source&&M.source.repo)||"forma";
 var pid=stack[stack.length-1];
 var lvl=pid?(node(pid)&&node(pid).name)||"level":"context";
 return String(repo+"-"+(BASE&&BASE.timeline?CPID+"-":"")+lvl).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"forma";
}
// Collect the CSS rules the SVG needs so a standalone serialize renders styled.
function collectSvgCss(){
 var out=[],ss=document.styleSheets,i,j;
 for(i=0;i<ss.length;i++){
  var rules;try{rules=ss[i].cssRules;}catch(e){continue;}
  if(!rules)continue;
  for(j=0;j<rules.length;j++){var r=rules[j],t=r.cssText||"";
   // keep rules that target svg-internal classes/elements + the color vars on :root/html
   if(/\.(nd|edge|edgehit|elbl|s-done|s-prog|s-next|s-plan|s-prob|s-unk|mode-t|tt|kk|dd|pp|plus|cat)\b/.test(t)
      ||/(^|[\s,])svg\b/.test(t)||/:root|html\[data-skin/.test(t)){
    // drop animations for a static export (keepdefs stable)
    out.push(t);
   }}
 }
 return out.join("\n");
}
// Resolve the CURRENT skin's variables from the live document, so a standalone SVG
// (where `html[data-skin=...]` selectors have no ancestor to match) still renders
// with the on-screen palette. Returns a "--k:v;--k:v" inline-style string.
var SVG_VARS=["--bg","--grid","--halo","--cyan","--sec","--ter","--ter2","--nm",
 "--stagebg","--stageborder","--nodebg","--detailbg","--border","--done","--prog",
 "--next","--plan","--planTxt","--prob","--unk","--edge","--edgeplan","--elbl","--ddtxt",
 "--now","--tgt","--src"];
function resolvedVars(){
 var cs;try{cs=getComputedStyle(document.documentElement);}catch(e){return "";}
 var out="";for(var i=0;i<SVG_VARS.length;i++){var v=(cs.getPropertyValue(SVG_VARS[i])||"").trim();if(v)out+=SVG_VARS[i]+":"+v+";";}
 return out;
}
function serializeSvg(){
 var svg=$("stage").querySelector("svg");if(!svg)return null;
 var clone=svg.cloneNode(true);
 clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
 clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");
 var vb=(svg.getAttribute("viewBox")||"0 0 1080 660").split(/\s+/);
 var vbx=+vb[0]||0,vby=+vb[1]||0,w=+vb[2]||1080,h=+vb[3]||660;
 clone.setAttribute("width",w);clone.setAttribute("height",h);
 // Inline the resolved variables on the root so var(--x) resolves standalone,
 // independent of the skin-selector chain that won't exist in the exported file.
 var vars=resolvedVars();if(vars)clone.setAttribute("style",vars);
 // solid dark/light background so the standalone file isn't transparent
 var bg=cssv("--stagebg")||"#050d14";
 var rect='<rect x="'+vbx+'" y="'+vby+'" width="'+w+'" height="'+h+'" fill="'+bg+'"/>';
 var style="<style>"+collectSvgCss()+"</style>";
 var inner=clone.innerHTML;
 var attrs='';for(var a=0;a<clone.attributes.length;a++){var at=clone.attributes[a];attrs+=' '+at.name+'="'+String(at.value).replace(/"/g,"&quot;")+'"';}
 var body='<svg'+attrs+'>'+style+rect+inner+'</svg>';
 return {xml:'<?xml version="1.0" encoding="UTF-8"?>\n'+body,w:w,h:h,bg:bg};
}
function triggerDownload(blob,filename){
 var url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();
 document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
// Every level you have arranged, in the exact shape meta.layout expects — drag the boxes, export,
// paste into the topology's "layout" and `gen` bakes it in. No storage: the repo is the memory.
function exportLayout(){
 var out={},k,id,p;
 for(k in POS){if(!POS.hasOwnProperty(k))continue;
  var lvl={},any=false;
  for(id in POS[k].pos){if(!POS[k].pos.hasOwnProperty(id))continue;
   p=POS[k].pos[id];lvl[id]={x:Math.round(p.x),y:Math.round(p.y),w:Math.round(p.w),h:Math.round(p.h)};any=true;}
  if(any)out[k]=lvl;}
 triggerDownload(new Blob([JSON.stringify({layout:out},null,2)+"\n"],{type:"application/json"}),exportBaseName()+"-layout.json");
}
function exportSvg(){
 var s=serializeSvg();if(!s)return;
 triggerDownload(new Blob([s.xml],{type:"image/svg+xml;charset=utf-8"}),exportBaseName()+".svg");
}
function exportPng(){
 var s=serializeSvg();if(!s)return;
 var scale=Math.min(3,Math.max(2,Math.round(2400/Math.max(1,s.w))))||2;
 var cw=Math.round(s.w*scale),ch=Math.round(s.h*scale);
 var img=new Image();
 var url=URL.createObjectURL(new Blob([s.xml],{type:"image/svg+xml;charset=utf-8"}));
 img.onload=function(){
  try{
   var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
   var ctx=cv.getContext("2d");
   ctx.fillStyle=s.bg||"#050d14";ctx.fillRect(0,0,cw,ch);
   ctx.drawImage(img,0,0,cw,ch);
   URL.revokeObjectURL(url);
   if(cv.toBlob)cv.toBlob(function(b){if(b)triggerDownload(b,exportBaseName()+".png");},"image/png");
   else{var dataUrl=cv.toDataURL("image/png");var a=document.createElement("a");a.href=dataUrl;a.download=exportBaseName()+".png";document.body.appendChild(a);a.click();document.body.removeChild(a);}
  }catch(e){URL.revokeObjectURL(url);}
 };
 img.onerror=function(){URL.revokeObjectURL(url);};
 img.src=url;
}
function wireExport(){
 var btn=$("pexp"),menu=$("pmenu");if(!btn||!menu)return;
 function close(){menu.classList.remove("open");btn.setAttribute("aria-expanded","false");}
 function toggle(){var open=menu.classList.toggle("open");btn.setAttribute("aria-expanded",open?"true":"false");}
 btn.addEventListener("click",function(ev){ev.stopPropagation();toggle();});
 document.addEventListener("click",function(ev){if(!menu.contains(ev.target)&&ev.target!==btn)close();});
 document.addEventListener("keydown",function(e){if(e.key==="Escape")close();});
 var sv=$("pexpSvg");if(sv)sv.addEventListener("click",function(){close();exportSvg();});
 var pn=$("pexpPng");if(pn)pn.addEventListener("click",function(){close();exportPng();});
 var lay=$("pexpLayout");if(lay)lay.addEventListener("click",function(){close();exportLayout();});
 var pr=$("pexpPrint");if(pr)pr.addEventListener("click",function(){close();window.print();});
}
function moveTip(ev){var st=$("stage").getBoundingClientRect(),t=$("etip");
 var x=ev.clientX-st.left+12,y=ev.clientY-st.top+12;
 t.style.left=Math.min(x,st.width-t.offsetWidth-6)+"px";t.style.top=Math.min(y,st.height-t.offsetHeight-6)+"px";}

// Fact-base line. `suffix` marks a RE-VERIFY that could not re-read the model (injected/offline).
function stamp(suffix){
 var m=(M&&M.meta)||{};
 $("stamp").textContent=STR.stampBase+" "+(m.verifiedAt||(M&&M.generatedAt)||(M&&M.source&&M.source.commit)||"—")
  +" · "+STR.stampMethod+" "+(m.verifyMethod||STR.stampVerify)
  +(BASE&&BASE.timeline?" · "+STR.stampProjection+" "+BASE.timeline.source:"")+(suffix?" "+suffix:"");
}
function loadModel(model,preserveCheckpoint){
 var wanted=preserveCheckpoint?CPID:null,candidate=null;
 try{candidate=jsonCopy(model);}catch(e){}
 LANG=pickLang(candidate);STR=STRINGS[LANG];
 try{document.documentElement.setAttribute("lang",LANG);}catch(e){}
 applyStrings();
 if(!candidate||!candidate.nodes||!candidate.nodes.length){$("err").style.display="block";$("err").textContent=STR.errEmpty;return;}
 var built=timelineStates(candidate);if(built.errors.length){$("err").style.display="block";$("err").textContent=STR.errTimeline+" "+built.errors.join(", ");return;}
 BASE=candidate;M=jsonCopy(candidate);
 $("err").style.display="none";TSTATES=built.states;
 var ttl=(M.meta&&M.meta.title)||((M.source&&M.source.repo)?"Forma · "+M.source.repo:null);
 if(ttl){$("title").textContent=ttl;try{document.title=ttl;}catch(e){}}
 if(!preserveCheckpoint)setSkin((new URLSearchParams(location.search).get("skin"))||window.__C4_SKIN__||(M.meta&&M.meta.skin)||"holo");
 if(!preserveCheckpoint){stack=[null];POSALL={};wanted=null;try{wanted=new URLSearchParams(location.search).get("checkpoint");}catch(e){}}
 setCheckpoint(wanted||"as-is",false,!preserveCheckpoint,preserveCheckpoint);
 // Minimal hook for embedders (the Cowork artifact re-verifies through its own MCP bridge and
 // needs to push the result back in without forking the viewer).
 window.__C4_API__={model:function(){return M;},checkpoint:function(id){setCheckpoint(id,true,true);},redraw:function(){draw(false);},stamp:function(t){$("stamp").textContent=t;}};
}
function boot(model){loadModel(model,false);}
function start(){
 // Pick language from URL/global up-front so header + errors render even if the model never loads.
 LANG=pickLang(null);STR=STRINGS[LANG];
 try{document.documentElement.setAttribute("lang",LANG);}catch(e){}
 applyStrings();
 wire();
 if(window.__C4_MODEL__){boot(window.__C4_MODEL__);return;}
 FETCHED=true; // the model has a live URL ⇒ RE-VERIFY can re-read it instead of only re-stamping
 try{fetch("./c4-model.json").then(function(r){return r.json();}).then(boot).catch(function(){
  $("err").style.display="block";$("err").textContent=STR.errNotFound;});}
 catch(e){$("err").style.display="block";$("err").textContent=STR.errUnavail;}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>
