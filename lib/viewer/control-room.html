<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma</title>
<style>
:root{color-scheme:dark;
 --bg:#120f0c;--surface:#1c1915;--line:#342f2b;--ink:#ebe7e4;--muted:#98918b;
 --ok:#34a45e;--warn:#bb881a;--bad:#d94543;--accent:#418ad1;--series2:#69625b;
 --ramp1:#2e5072;--ramp2:#326394;--ramp3:#3978b5;--ramp4:#428dd5}
html[data-theme="light"]{color-scheme:light;
 --bg:#f9f6f2;--surface:#ffffff;--line:#dbd7d0;--ink:#1d1a16;--muted:#68625b;
 --ok:#007f3b;--warn:#a66d00;--bad:#c2272d;--accent:#0267c7;--series2:#a9a49c;
 --ramp1:#8cb1e0;--ramp2:#6598d8;--ramp3:#3a7ed1;--ramp4:#0063c5}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button,a,summary{font:inherit}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:3px}
a:hover{color:var(--accent)}
button{appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:fixed;left:12px;top:10px;z-index:20;padding:8px 12px;background:var(--surface);border:1px solid var(--accent);transform:translateY(-150%)}
.skip:focus{transform:none}
.site-header{max-width:1180px;margin:0 auto;padding:34px 24px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.site-header h1{margin:0;font-size:clamp(22px,3vw,34px);line-height:1.1;letter-spacing:-.02em}
.stamp{margin:7px 0 0;color:var(--muted);font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace}
.jump{position:sticky;top:0;z-index:10;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto;white-space:nowrap}
.jump-inner{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:26px}
.jump a{display:block;padding:13px 0;color:var(--muted);font-size:13px;text-decoration:none}
.jump a:hover,.jump a:focus-visible{color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:0 24px 96px}
.brief-section{padding:72px 0;border-top:1px solid var(--line)}
.brief-section:first-child{border-top:0;padding-top:68px}
h2{margin:0 0 30px;font-size:clamp(26px,4vw,44px);line-height:1.05;letter-spacing:-.03em}
h3{margin:42px 0 16px;font-size:21px;line-height:1.2;letter-spacing:-.015em}
h4{margin:0;font-size:15px;line-height:1.3}
p{max-width:72ch}
.thesis{max-width:900px;margin:0 0 40px;font-size:clamp(30px,5.4vw,68px);line-height:1.04;letter-spacing:-.035em;font-weight:650}
.section-note,.muted,.chart-note{color:var(--muted)}
.section-note{margin:-18px 0 32px}
.proportion{height:18px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 2px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:6px}
.issue-list,.audit-list{border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:18px 34px 18px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:6px;top:17px;color:var(--muted);font-family:"SF Mono",Menlo,Consolas,monospace}
details[open]>summary:after{content:"−"}
.issue-summary{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:12px}
.issue-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue-ref,.data-text{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.issue-ref{color:var(--muted);white-space:nowrap}
.landing-fact{color:var(--muted);font-size:12px;white-space:nowrap}
.issue-title{font-weight:620}
.detail-body{padding:0 34px 22px 0;display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:8px 20px}
.detail-body dt{color:var(--muted);font-size:12px}
.detail-body dd{margin:0;min-width:0}
.tokens{display:flex;gap:6px;flex-wrap:wrap}
.token{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-family:"SF Mono",Menlo,Consolas,monospace}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;white-space:nowrap}
.status-glyph{width:14px;text-align:center;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px}
.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}.status-none{color:var(--muted)}
.moving-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.moving-grid details{padding-right:24px}
.moving-grid details+details{padding-left:24px;border-left:1px solid var(--line)}
.moving-summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.moving-count{font-size:28px;font-weight:650}
.cluster{padding:11px 0;border-top:1px solid var(--line)}
.cluster:first-child{border-top:0}
.cluster-name{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
.cluster-links{display:flex;gap:8px;flex-wrap:wrap}
.audit-group{margin-top:42px}
.audit-group:first-of-type{margin-top:0}
.audit-group h3{margin-top:0}
.audit-row{padding:15px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:20px}
.audit-row>span:first-child{color:var(--muted)}
.plain-missing{margin:0;padding:18px 0;border-bottom:1px solid var(--line)}
.map-block{margin-top:42px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:12px}
.map-head h3{margin:0}
.map-caption{margin:10px 0 0;color:var(--muted);font-size:12px}
.map-frame{width:100%;height:680px;display:block;border:1px solid var(--line);background:var(--surface)}
.portfolio-chart{margin-bottom:54px}
.program-block{padding:54px 0 18px;border-top:1px solid var(--line)}
.program-block:first-of-type{border-top:0}
.program-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:28px}
.program-head h3{margin:0;font-size:28px}
.program-head p{margin:0;color:var(--muted)}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 34px;align-items:start}
.chart{position:relative;margin:0;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.chart.wide{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.chart-toggle{padding:5px 10px;font-size:11px;flex:0 0 auto}
.chart-viz{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.mark-accent{fill:var(--accent)}.mark-series2{fill:var(--series2)}.mark-bad{fill:var(--bad)}
.meter-track{fill:var(--accent);opacity:.18}.area-fill{fill:var(--accent);opacity:.18}.area-line{fill:none;stroke:var(--accent);stroke-width:2}
.svg-label{fill:var(--muted);font:11px "SF Mono",Menlo,Consolas,monospace}
.svg-value{fill:var(--ink);font:11px "SF Mono",Menlo,Consol,monospace}
.chart-hit{cursor:help;outline:none}
.chart-hit:focus{stroke:var(--accent);stroke-width:2}
.chart-tip{position:fixed;z-index:30;pointer-events:none;max-width:280px;padding:7px 9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;line-height:1.35}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tabular-nums{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
@media(max-width:820px){
 .site-header{padding:24px 18px 18px}.jump-inner,main{padding-left:18px;padding-right:18px}
 .brief-section{padding:54px 0}.brief-section:first-child{padding-top:52px}
 .moving-grid,.chart-grid{grid-template-columns:1fr}.moving-grid details+details{padding-left:0;border-left:0}.moving-grid details{padding-right:0}
 .chart.wide{grid-column:auto}.program-head,.map-head{align-items:flex-start;flex-direction:column;gap:7px}
 .detail-body,.audit-row{grid-template-columns:1fr;gap:3px}.issue-summary{grid-template-columns:auto 1fr}.issue-title{grid-column:1/-1}
 .map-frame{height:540px}
}
@media print{.jump,.theme-toggle,.chart-toggle,.chart-tip,.skip{display:none!important}.brief-section{break-inside:avoid}.map-frame{height:520px}body{background:var(--bg)}}
</style>
</head>
