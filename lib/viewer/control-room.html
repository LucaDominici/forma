<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23122'/%3E%3Ccircle cx='8' cy='8' r='3.5' fill='%233ee7ff'/%3E%3C/svg%3E">
<style>
/* Every value here was produced by `node scripts/palette.mjs`, which is the script docs/DESIGN.md
   D6 claimed had already been run and which did not exist until it was written. OKLCH because the
   thing being held constant is perceptual lightness: the status trio is separated by L on purpose,
   since lightness is the one channel that survives colour-blind vision, and in hex that separation
   is invisible to the person editing it.
   Do not hand-tune a value here. Change the target in the script, re-run it, and paste the result. */
:root{color-scheme:dark;
 --bg:oklch(17.1% 0.008 67);--surface:oklch(21.5% 0.009 75);--line:oklch(30.9% 0.010 61);
 --ink:oklch(93.0% 0.006 60);--muted:oklch(61.5% 0.012 63);
 --ok:oklch(74.6% 0.145 152);--warn:oklch(86.8% 0.126 80);--bad:oklch(64.7% 0.185 25);
 --accent:oklch(61.4% 0.130 250);--series2:oklch(52.5% 0.014 67);
 --ramp1:oklch(52.5% 0.070 250);--ramp2:oklch(56.0% 0.090 250);--ramp3:oklch(59.5% 0.110 250);--ramp4:oklch(63.0% 0.132 250)}
html[data-theme="light"]{color-scheme:light;
 --bg:oklch(97.4% 0.006 75);--surface:oklch(99.5% 0.005 78);--line:oklch(88.0% 0.010 82);
 --ink:oklch(22.0% 0.009 75);--muted:oklch(54.0% 0.013 72);
 --ok:oklch(52.9% 0.141 151);--warn:oklch(44.4% 0.094 73);--bad:oklch(35.5% 0.144 25);
 --accent:oklch(54.2% 0.169 255);--series2:oklch(63.3% 0.013 80);
 --ramp1:oklch(63.3% 0.079 255);--ramp2:oklch(59.2% 0.110 255);--ramp3:oklch(55.1% 0.145 255);--ramp4:oklch(51.0% 0.172 255)}

/* THE SHELL. This is a viewport-sized application, not a document: the page never scrolls, panels
   scroll inside themselves, and every view fits the screen it was opened on. The number that
   governs the layout is not 1080 — a real 1920x1080 monitor leaves ~900px of viewport once the tab
   strip, the address bar and the taskbar have taken their share, so ~815px of content is the floor
   every view is designed against. Below 1200px wide the shell lets go and the page scrolls again,
   which is the right answer for a phone and is stated rather than pretended away. */
*{box-sizing:border-box}
:root{--pad:16px;--gap:16px;--bar:52px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
 display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button,a,summary,select{font:inherit;color:inherit}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:2px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.skip{position:fixed;left:8px;top:6px;z-index:40;min-height:44px;padding:6px 10px;background:var(--surface);border:1px solid var(--accent);transform:translateY(-160%)}
.skip:focus{transform:none}

/* One bar. The previous shell spent 177px on a header plus two rows of navigation, which is 20% of
   the floor's usable height before a single number is shown. */
.bar{display:flex;align-items:center;gap:18px;height:var(--bar);padding:0 var(--pad);
 border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:0 1 auto}
.brand h1{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:11px;font-family:"SF Mono",Menlo,Consolas,monospace}
.tabs{display:flex;gap:2px;align-items:center;flex:0 0 auto}
.tabs a{display:flex;align-items:center;min-height:44px;padding:5px 10px;color:var(--muted);font-size:12.5px;text-decoration:none;border-radius:5px}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.tabs a[aria-current]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.bar-sep{width:1px;height:20px;background:var(--line);flex:0 0 auto}
.bar-end{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
.ghost{min-width:44px;min-height:44px;appearance:none;border:1px solid var(--line);border-radius:999px;background:none;padding:4px 10px;font-size:12px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.mobile-nav{display:none;min-width:0;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.mobile-nav select{min-width:0;width:100%;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 28px 0 10px}

main{min-height:0;padding:var(--pad);overflow:hidden}
.view{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--gap);height:100%;min-height:0}
.view[data-single]{grid-template-rows:minmax(0,1fr)}

/* A panel is a region, not a card: a top rule and a heading on the same ground. Boxing every
   region would add three borders and a shadow to say what one hairline already says, and nesting
   the issue rows inside those boxes would be a card inside a card. */
.panel{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);padding-top:8px}
.panel,.panel-head,.panel-body,.chart-viz,.tablewrap{min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:0 0 auto}
.panel h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
/* THE SIGNATURE. No panel without its provenance: one line saying what was counted and what
   re-checks it. Every other dashboard asks to be believed; this one says how to check it. */
.prov{margin:1px 0 6px;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace;
 overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere;flex:0 0 auto}
.panel-body{min-height:0;overflow:auto;flex:1 1 auto;scrollbar-width:thin}
.panel-body>p{max-width:72ch}
.answer-lead{grid-column:1/-1;padding:14px 0 12px}
.answer-lead .lede{max-width:70ch}
.empty-state{max-width:68ch;padding:10px 0 4px}
.empty-state strong{display:block;margin-bottom:4px;font-size:14px}
.empty-state p{margin:0 0 8px;color:var(--muted)}
.empty-state .next{color:var(--ink)}

.answer{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.evidence{display:grid;gap:var(--gap);min-height:0;overflow:auto;scrollbar-width:thin;
 grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,auto);align-content:start}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
@media(min-width:1500px){
 .answer,.evidence{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:2300px){
 :root{--pad:22px;--gap:20px}
 .answer,.evidence{grid-template-columns:repeat(4,minmax(0,1fr))}
 body{font-size:15px}
 .evidence{grid-auto-rows:minmax(0,auto)}
 .chart-viz{min-height:220px}
}
/* Below the floor the shell is released rather than crushed: the page scrolls.
   Gated on HEIGHT as well as width, because the budget being protected is vertical: a 1920x640
   window is not a phone, and holding the locked shell there delivered the whole evidence tier
   through a 97px slot with no page scrollbar. 760px is the height at which 52px of bar, 32px of
   padding and two usable rows stop fitting. */
@media(max-width:1199px),(max-height:760px){
 body{height:auto;overflow:visible;display:block}
 main{overflow:visible;height:auto}
 .bar{position:sticky;top:0;z-index:20;background:var(--bg)}
 .view{height:auto;display:block}
 .answer,.evidence{overflow:visible;grid-auto-rows:auto}
 .panel{margin-bottom:var(--gap)}
 .panel-body{overflow:visible;max-height:none}
}
/* Only a NARROW release collapses to one column. Folding the column rule into the query above
   meant a wide, short window — an ultrawide snapped to half height — released into a single
   3381px column: `.answer` alone grew to 1535px and "Now" sat 1609px below the fold, for content
   that occupies 520px at full height. Releasing the height should let the page scroll, not throw
   away 2200px of width. */
@media(max-width:1199px){
 .answer,.evidence{grid-template-columns:1fr}
 .span2,.full{grid-column:auto}
}

/* Type. One thing on the page is large: the thesis. Everything else is 10.5-14px, because a
   briefing that fits a screen buys its density from restraint, not from shrinking the answer. */
.thesis{margin:0;font-size:clamp(19px,1.55vw,30px);line-height:1.15;letter-spacing:-.02em;font-weight:650;max-width:26ch}
.lede{margin:6px 0 0;color:var(--muted);font-size:12px;max-width:52ch}
.muted{color:var(--muted)}
.data{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px}

/* KPI strip: one row of numbers, hairline-separated, no boxes. */
.kpis{display:flex;gap:0;flex-wrap:wrap}
.kpi{flex:1 1 130px;padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi dt{margin:0 0 2px;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi dd{margin:0;font-size:clamp(20px,1.5vw,28px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi dd small{display:block;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--muted);line-height:1.3;white-space:normal}

/* Rows. `details` stays: expanding evidence in place is the product's own reading model (D5). */
.rows>details{border-bottom:1px solid var(--line)}
summary{min-height:44px;list-style:none;cursor:pointer;padding:7px 22px 7px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:4px;top:6px;color:var(--muted);font-family:"SF Mono",Menlo,Consolas,monospace}
details[open]>summary:after{content:"\2212"}
.row-head{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:9px}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ref{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.detail{padding:0 22px 10px 0;display:grid;grid-template-columns:minmax(96px,132px) 1fr;gap:4px 14px;font-size:12.5px}
.detail dt{color:var(--muted);font-size:11px}
.detail dd{margin:0;min-width:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;white-space:nowrap}
.glyph{width:12px;text-align:center;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px}
.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}.status-none{color:var(--muted)}
.issue-pill{display:inline-flex;align-items:center;min-height:44px;gap:6px;max-width:100%;padding:1px 7px 1px 4px;border:1px solid var(--line);border-radius:999px;text-decoration:none}
.issue-pill .issue-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.issue-pill.closed .issue-text{text-decoration:line-through}
.tally{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:7px}
.group{padding:6px 0;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-name{display:block;margin-bottom:3px;color:var(--muted);font-size:10.5px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.kanban-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap);min-height:0;overflow:auto;scrollbar-width:thin}
.kanban-issue{padding:6px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0}
.kanban-issue .issue-pill{display:flex;line-height:1.35}
.queue-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--gap);min-height:0;overflow:auto;scrollbar-width:thin;align-content:start}
.queue-item{min-width:0;padding:7px 0;border-bottom:1px solid var(--line)}
.queue-item .issue-pill{display:flex;font-weight:600;margin-bottom:4px}
.queue-command{display:flex;align-items:center;gap:6px;min-width:0}
.queue-command code{min-width:0;overflow:auto;white-space:nowrap;flex:1 1 auto}
@media(max-width:1199px){.queue-board{grid-template-columns:minmax(0,1fr)}}
.workflow{border-top:1px solid var(--line)}
.workflow>summary{min-height:44px;display:flex;align-items:center;font-weight:650}
.workflow-body{padding-bottom:8px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.pager button{min-height:44px;appearance:none;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:5px 10px;cursor:pointer}
.pager button:disabled{opacity:.45;cursor:default}
.pager-status{color:var(--muted);font-size:11px;text-align:center}
.print-only{display:none}
.kv{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:12px;font-size:12.5px}
.kv>*{min-width:0;overflow-wrap:anywhere}
.kv>span:first-child{color:var(--muted)}

/* Charts fill the box the grid gave them. The old viewBox had a fixed height and took its width
   from the aspect ratio, which is exactly why a grid row could never contain one. */
.chart{min-height:0}
/* A chart is the one panel that needs a floor now that evidence rows size to content (F2): an SVG
   has no intrinsic height, so without this a chart would collapse to its heading. 180px keeps a
   single bar or a short series legible without reserving a whole screen row. */
.chart-viz{flex:1 1 auto;min-height:180px;position:relative}
.chart-compact .chart-viz{min-height:112px}
.chart-viz svg{display:block;width:100%;height:100%}
.axis{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.mark-accent{fill:var(--accent)}.mark-series2{fill:var(--series2)}.mark-bad{fill:var(--bad)}
.meter-track{fill:var(--accent);opacity:.18}.area-fill{fill:var(--accent);opacity:.16}
.area-line{fill:none;stroke:var(--accent);stroke-width:2}
.line-series2{fill:none;stroke:var(--series2);stroke-width:2;stroke-dasharray:4 3}
.svg-label{fill:var(--muted);font:10.5px "SF Mono",Menlo,Consolas,monospace}
.svg-value{fill:var(--ink);font:10.5px "SF Mono",Menlo,Consolas,monospace}
.hit{pointer-events:none;outline:none}
.hit:focus{stroke:var(--accent);stroke-width:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;flex:0 0 auto;padding-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:5px}
.tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:5px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11.5px;line-height:1.3}
.toggle{min-height:44px;appearance:none;border:1px solid var(--line);border-radius:999px;background:none;padding:2px 8px;font-size:10.5px;cursor:pointer;color:var(--muted);flex:0 0 auto}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.tablewrap{overflow:auto;min-height:0;flex:1 1 auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--bg)}
.nums{font-variant-numeric:tabular-nums}
.matrix .id{font-family:"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
.hole{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px;font-size:12px}
.hole>span:first-child{color:var(--bad);font-size:11px}

/* The map finally gets the area an ultrawide actually has. It is a diagram, not a list: it uses the
   height it reserves, so it keeps an explicit floor now that evidence rows size to content (F2). */
.frame{width:100%;max-width:100%;height:100%;min-height:420px;display:block;border:1px solid var(--line);background:var(--surface)}
/* Two panes, not an accordion: a document is not a disclosure widget. */
.reader{margin:0;max-width:78ch;font-size:13px;line-height:1.6}
.md p{margin:0 0 10px;max-width:72ch}
.md-h{font-weight:650;letter-spacing:-.01em;margin:16px 0 6px}
.md-h1{font-size:17px;margin-top:0}.md-h2{font-size:15px}.md-h3{font-size:13.5px}
.md-h4,.md-h5,.md-h6{font-size:12.5px;color:var(--muted)}
/* Real ul/ol/li, so the marker is the browser's. The hand-drawn en dash that used to sit in a
   ::before is gone: keeping it would print twice, once from the pseudo-element and once from the
   list marker the element now has. */
.md-ul,.md-ol{margin:0 0 10px;padding-left:20px}
.md-ul{list-style:disc}.md-ol{list-style:decimal}
.md-li{margin:0 0 4px;max-width:70ch}
.md-li::marker{color:var(--muted)}
.md-q{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);max-width:70ch}
.md-q>p:last-child{margin-bottom:0}
.md-pre{margin:0 0 10px;padding:8px 10px;background:var(--surface);overflow:auto;font:11.5px/1.5 "SF Mono",Menlo,Consolas,monospace}
.md-code{font:11.5px "SF Mono",Menlo,Consolas,monospace;color:var(--muted)}
.md-table{margin:0 0 12px;font-size:11.5px}
.md-hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.print-all{display:none}
.doclist button{display:block;width:100%;text-align:left;appearance:none;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;font-size:12.5px}
.kv a,.matrix a,.doc-reader-head a{display:inline-flex;align-items:center;min-height:44px}
.doclist button:hover{color:var(--accent)}
.doclist button[aria-current]{color:var(--ink);box-shadow:inset 2px 0 0 var(--accent);padding-left:9px}
.doclist small{display:block;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace}
.opt{padding:7px 0;border-bottom:1px solid var(--line)}
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.flag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;color:var(--muted)}
.flag.on{border-color:var(--accent);color:var(--accent)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media(max-width:600px){
 :root{--pad:12px;--gap:14px;--bar:112px}
 .bar{height:auto;min-height:var(--bar);padding:8px var(--pad);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
 .brand{align-self:center}.brand h1{font-size:15px}.brand span{font-size:11px}
 .bar-sep,.bar>.tabs{display:none}
 .bar-end{grid-column:2;grid-row:1;margin:0}
 .ghost{min-height:44px;min-width:44px;padding:5px 9px}
 .prov{overflow:visible;text-overflow:clip;white-space:normal;overflow-wrap:anywhere}
 .mobile-nav{display:grid;grid-column:1/-1;grid-row:2}
 main{padding:var(--pad)}
 .thesis{font-size:24px;max-width:22ch}
 .answer-lead{padding-top:8px}
 summary,.doclist button,.toggle,.issue-pill{min-height:44px}
 .kv a,.matrix a{display:inline-flex;align-items:center;min-height:44px}
 .issue-pill{align-items:center}
 .kv,.hole{grid-template-columns:1fr;gap:2px}
 .detail{grid-template-columns:1fr;gap:2px}
 .kanban-board,.queue-board{grid-template-columns:minmax(0,1fr)}
 .workflow,.workflow-body{min-width:0}
 .kpi{flex-basis:48%;padding:8px 10px}.kpi:nth-child(odd){border-left:0;padding-left:0}
}

/* Printing hands over the WHOLE briefing. A hash route is not something anyone can put on paper,
   so the shell is released, every view is un-hidden, and each starts a page. */
@media print{
 /* The print palette is DECLARED, not inherited. Setting only body{color:#000} left every token at
    its dark-theme value, so chart numbers printed at 1.23:1 against white — invisible — and every
    provenance line at 3.73:1. Worse, the theme persists to localStorage, so the paper output
    differed depending on what the reader last clicked. These are the measured light values.

    Declared is not the same as WINNING. A media query adds no specificity, so `:root` here scored
    (0,1,0) and `html[data-theme="light"]` scored (0,1,1) and outranked it: every reader who had
    ever pressed the theme button printed the light UI palette instead, --muted at 5.05:1 and the
    hairline at 1.43:1, on cream. The dark case only passed because it TIED the base :root and won
    on source order — the accident, not the rule. Doubling the pseudo-class scores (0,2,1), above
    any single-attribute theme selector, so this wins on specificity and not on where it sits.
    scripts/palette.mjs now compares the two and fails if a theme selector ever catches up. */
 html:root:root{
  --bg:oklch(100% 0 0);--surface:oklch(100% 0 0);--line:oklch(80% 0 0);
  --ink:oklch(22.0% 0.009 75);--muted:oklch(44.0% 0.010 72);

 if(!docs.embedded.length)emptyState(lp,STR.docsCanonMissing,STR.docsCanonNext);
 if(docs.listed.length){
  var others=el("div","group");
  others.appendChild(el("span","group-name",STR.docsOther));
  var listed=el("div");others.appendChild(listed);
  pagedList(listed,docs.listed,function(l){var row=el("div","kv");row.appendChild(docLink(program,l.path));row.appendChild(el("span","",l.why==="budget"?STR.docsTooLarge:(l.lines==null?"":fmt(STR.docsLines,{n:l.lines}))));return row;});
  lp.body.appendChild(others);
 }
 ev.appendChild(lp);if(docs.embedded.length)ev.appendChild(rp);
 view.appendChild(ev);
 if(docs.embedded.length)open(0);
}

function viewOptions(view){
 view.setAttribute("data-single","");
 var ev=el("div","evidence"),i,j;
 var ip=panel(STR.optIncluded,fmt(STR.provOptions,{file:ROOM.meta.generatedFrom}),"span2");
 for(i=0;i<ROOM.programs.length;i++){
  var p=ROOM.programs[i],row=el("div","opt"),head=el("div"),flags=el("div","flags");
  head.appendChild(el("strong","",p.id));head.appendChild(el("span","muted"," — "+p.ghRepo));
  if(SERVED)head.appendChild(toggle(p.id,true));
  row.appendChild(head);
  var has=[[STR.optHasMap,p.hasMap],[STR.optHasHealth,((p.health&&p.health.verdicts)||[]).length>0],
           [STR.optHasFindings,((p.findings&&p.findings.findings)||[]).length>0],
           [STR.optHasRtm,!!p.derived.rtm],[STR.optHasDocs,!!(p.docs&&p.docs.embedded.length)],
           [STR.optHasBlockedBy,sumOf(p.id).blockedRule.declared]];
  for(j=0;j<has.length;j++)flags.appendChild(el("span","flag"+(has[j][1]?" on":""),has[j][0]+": "+(has[j][1]?STR.optYes:STR.optNo)));
  row.appendChild(flags);ip.body.appendChild(row);
 }
 ev.appendChild(ip);

 var xp=panel(STR.optExcluded,STR.provExcluded),ex=ROOM.meta.excluded||[];
 if(!ex.length)xp.body.appendChild(el("p","muted",STR.optNoneExcluded));
 for(i=0;i<ex.length;i++){
  var r=el("div","kv"),why=el("span");
  r.appendChild(el("span","data",ex[i].id));
  why.appendChild(el("span","",STR.optReasonDisabled));
  if(SERVED)why.appendChild(toggle(ex[i].id,false));
  r.appendChild(why);xp.body.appendChild(r);
 }
 xp.body.appendChild(el("p","muted",fmt(STR.optHowToChange,{file:ROOM.meta.generatedFrom})));
 ev.appendChild(xp);
 view.appendChild(ev);
}

// A checkbox appears only when the COMPOSER said this copy has somewhere to write to — which is
// only true of the page `forma room --serve` hands out. Inferring it from location.protocol was
// wrong in the way that matters: it is true on any static host, so the public demo on Pages would
// have rendered live switches whose PUT lands on nothing. A dead switch teaches the reader the page
// lies, which is the one thing this briefing cannot afford.
var SERVED=window.__WRITABLE__===true;
function toggle(id,enabled){
 var wrap=el("label","flag"+(enabled?" on":"")),box=document.createElement("input"),err=el("span","muted");
 box.type="checkbox";box.checked=enabled;box.style.marginRight="5px";
 wrap.style.marginLeft="8px";
 wrap.appendChild(box);wrap.appendChild(document.createTextNode(enabled?STR.optYes:STR.optNo));
 box.addEventListener("change",function(){
  var b={};b[id]=box.checked;box.disabled=true;
  fetch("/programs",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(b)})
   .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t);});})
   .then(function(){location.reload();})
   .catch(function(e){box.disabled=false;box.checked=!box.checked;err.textContent=" "+String(e.message||e);});
 });
 var span=el("span");span.appendChild(wrap);span.appendChild(err);return span;
}

/* --------------------------------- routing -------------------------------- */
var VIEWS={},VIEW_SPEC={},ORDER=[],PRINT_FILL=[];
var TABS=[["exec",function(){return STR.routeExec;}],["tech",function(){return STR.routeTech;}],
          ["map",function(){return STR.routeMap;}],["wbs",function(){return STR.routeWbs;}],
          ["docs",function(){return STR.routeDocs;}]];
var BUILD={exec:viewExec,tech:viewTech,map:viewMap,wbs:viewWbs,docs:viewDocs};
function key(p,t){return p?"/"+p+"/"+t:"/"+t;}
function mount(k){
 var v=el("section","view");v.id="view-"+k.replace(/[^a-z0-9]+/gi,"-");v.hidden=true;
 v.appendChild(el("p","print-id",""));
 document.getElementById("content").appendChild(v);VIEWS[k]=v;ORDER.push(k);return v;
}
/* A running header, because `.print-id` is a block element and a block element stamps the page it
   starts on: seven identity lines covered seven of twenty-nine sheets, and the twenty in the
   Documents view came out anonymous. A `@page` margin box repeats on every sheet and is the only
   place `counter(page)` is legal, so it also carries the page number the briefing never had.
   Measured in Chrome 151 before being written, not recalled: 34 of 34 pages, numbers included. */
function stampRunningHead(){
 // ROOM.meta is repository text and this builds a CSS string, so the quote and the backslash are
 // escaped for the same reason I14 keeps that text out of markup. A newline is illegal inside a CSS
 // string, not merely ugly, and would silently drop the whole rule.
 var esc=function(s){return String(s==null?"":s).replace(/[\\"]/g,"\\$&").replace(/[\r\n\f]+/g," ");};
 var head=esc((ROOM.meta.title||STR.appTitle)+"  ·  "+ROOM.meta.today);
 var s=document.createElement("style");
 s.textContent="@page{margin:16mm 12mm 12mm;"+
  "@top-left{content:\""+head+"\";font:8pt \"SF Mono\",Menlo,Consolas,monospace;color:var(--muted)}"+
  "@top-right{content:counter(page) \" / \" counter(pages);font:8pt \"SF Mono\",Menlo,Consolas,monospace;color:var(--muted)}}";
 document.head.appendChild(s);
}
function stampPrintIds(){
 var k,p,name;
 for(k in VIEWS)if(VIEWS.hasOwnProperty(k)){
  p=progOf(k);
  name=k==="/"?STR.routePortfolio:k==="/options"?STR.routeOptions:tabLabel(k);
  VIEWS[k].querySelector(".print-id").textContent=
   (ROOM.meta.title||STR.appTitle)+"  ·  "+(p?p+"  ·  ":"")+name+"  ·  "+ROOM.meta.today;
 }
}
function registerAll(){
 var i,j;
 mount("/");VIEW_SPEC["/"]={kind:"portfolio"};
 for(i=0;i<ROOM.programs.length;i++){
  var program=ROOM.programs[i];
  for(j=0;j<TABS.length;j++){var k=key(program.id,TABS[j][0]);mount(k);VIEW_SPEC[k]={kind:"program",program:program,tab:TABS[j][0]};}
 }
 mount("/options");VIEW_SPEC["/options"]={kind:"options"};
}
function ensureView(k){
 var view=VIEWS[k],spec=VIEW_SPEC[k];if(!view||view.getAttribute("data-built"))return view;
 view.setAttribute("data-built","true");
 if(spec.kind==="portfolio")viewPortfolio(view);
 else if(spec.kind==="options")viewOptions(view);
 else BUILD[spec.tab](view,spec.program,sumOf(spec.program.id));
 return view;
}
// The pre-tab anchors stay valid addresses: #now was a link somebody could have sent.
var LEGACY={verdict:"/",now:"/",moving:"/",mismatch:"/",programs:"/",map:null};
function normalize(h){
 var raw=String(h||"").replace(/^#/,"");
 if(!raw)return "/";
 if(raw.charAt(0)==="/"){
  var old=/^\/([^/]+)\/(auto|kanban)$/.exec(raw);
  if(old&&byId(old[1]))return key(old[1],"tech");
  return VIEWS[raw]?raw:"/";
 }
 if(LEGACY.hasOwnProperty(raw)){
  if(LEGACY[raw])return LEGACY[raw];
  var f=ROOM.programs[0];return f?key(f.id,raw==="map"?"map":"exec"):"/";
 }
 return "/";
}
function progOf(k){var m=/^\/([^/]+)\/([^/]+)$/.exec(k);return m?m[1]:null;}
function navLink(href,text){var a=el("a","",text);a.href="#"+href;return a;}
// Built once. Rebuilding it on every route change destroyed the anchor the user had just pressed
// and left focus on <body>, so each navigation forced a Tab-from-the-top.
function buildNav(){
 var progs=document.getElementById("nav-programs"),views=document.getElementById("nav-views"),i,j;
 progs.appendChild(navLink("/",STR.routePortfolio));
 for(i=0;i<ROOM.programs.length;i++)progs.appendChild(navLink(key(ROOM.programs[i].id,"exec"),ROOM.programs[i].id));
 progs.appendChild(navLink("/options",STR.routeOptions));
 // One set of view tabs, re-pointed at whichever programme is open. They are present from the
 // first screen rather than appearing only after the reader guesses that a lowercase repo id
 // between two sentence-case labels is the primary action.
 for(i=0;i<TABS.length;i++){
  var a=navLink("/",TABS[i][1]());
  a.setAttribute("data-tab",TABS[i][0]);
  views.appendChild(a);
 }
 progs.addEventListener("focusin",function(e){e.target.scrollIntoView({block:"nearest",inline:"nearest"});});
 views.addEventListener("focusin",function(e){e.target.scrollIntoView({block:"nearest",inline:"nearest"});});
 var mobileProgram=document.getElementById("mobile-program"),mobileView=document.getElementById("mobile-view"),o;
 mobileProgram.setAttribute("aria-label",STR.navMain);mobileView.setAttribute("aria-label",STR.navProgram);
 o=el("option","",STR.routePortfolio);o.value="/";mobileProgram.appendChild(o);
 for(i=0;i<ROOM.programs.length;i++){o=el("option","",ROOM.programs[i].id);o.value=ROOM.programs[i].id;mobileProgram.appendChild(o);}
 o=el("option","",STR.routeOptions);o.value="/options";mobileProgram.appendChild(o);
 for(i=0;i<TABS.length;i++){o=el("option","",TABS[i][1]());o.value=TABS[i][0];mobileView.appendChild(o);}
 mobileProgram.addEventListener("change",function(){location.hash=mobileProgram.value.charAt(0)==="/"?mobileProgram.value:key(mobileProgram.value,mobileView.value||"exec");});
 mobileView.addEventListener("change",function(){var p=mobileProgram.value;if(p.charAt(0)!=="/")location.hash=key(p,mobileView.value);});
}
function renderNav(k){
 var progs=document.getElementById("nav-programs"),views=document.getElementById("nav-views"),i;
 var p=progOf(k)||(ROOM.programs[0]&&ROOM.programs[0].id);
 var links=progs.querySelectorAll("a");
 for(i=0;i<links.length;i++){
  var href=links[i].getAttribute("href").slice(1);
  // "true", not "page". Two landmarks both marking their selection as aria-current="page" made a
  // screen reader announce "current page" twice on one screen; only ONE of them is the page. The
  // programme is the current item within its list, which is what the plain token means.
  if(href===k||(progOf(k)&&href===key(progOf(k),"exec")))links[i].setAttribute("aria-current","true");
  else links[i].removeAttribute("aria-current");
 }
 var tabs=views.querySelectorAll("a");
 for(i=0;i<tabs.length;i++){
  var t=tabs[i].getAttribute("data-tab"),target=p?key(p,t):"/";
  tabs[i].href="#"+target;
  if(k===target){tabs[i].setAttribute("aria-current","page");tabs[i].scrollIntoView({block:"nearest",inline:"nearest"});}
  else tabs[i].removeAttribute("aria-current");
 }
 var mp=document.getElementById("mobile-program"),mv=document.getElementById("mobile-view"),match=/^\/([^/]+)\/([^/]+)$/.exec(k);
 mp.value=match?match[1]:k;mv.disabled=!match;if(match)mv.value=match[2];
}
function show(k){
 var x;ensureView(k);
 for(x in VIEWS)if(VIEWS.hasOwnProperty(x))VIEWS[x].hidden=x!==k;
 renderNav(k);
 var p=progOf(k);
 var name=(k==="/"?STR.routePortfolio:k==="/options"?STR.routeOptions:tabLabel(k));
 document.title=(ROOM.meta.title||STR.appTitle)+(p?" · "+p:"")+" · "+name;
 announce(p?p+" · "+name:name);
 relayoutAll(VIEWS[k]);focusScrollers(VIEWS[k]);
}
function tabLabel(k){
 var m=/^\/[^/]+\/([^/]+)$/.exec(k),i;
 if(m)for(i=0;i<TABS.length;i++)if(TABS[i][0]===m[1])return TABS[i][1]();
 return k;
}
function announce(text){var l=document.getElementById("live");if(l)l.textContent=text;}
function onHash(){show(normalize(location.hash));}

function applyTheme(){
 var saved=null,t;
 try{saved=localStorage.getItem("forma-room-theme");}catch(e){}
 t=saved==="light"||saved==="dark"?saved:(ROOM&&ROOM.meta&&ROOM.meta.theme==="dark"?"dark":"light");
 document.documentElement.setAttribute("data-theme",t);themeButton(t);
}
function themeButton(t){var b=document.getElementById("theme-toggle"),n=t==="dark"?STR.themeLight:STR.themeDark;b.textContent=n;b.setAttribute("aria-label",n);b.setAttribute("aria-pressed",t==="light"?"true":"false");}
function wireTheme(){
 document.getElementById("theme-toggle").addEventListener("click",function(){
  var n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("forma-room-theme",n);}catch(e){}
  themeButton(n);pushSkin();
 });
}

var resizeTimer=null;
function onResize(){
 if(resizeTimer)clearTimeout(resizeTimer);
 resizeTimer=setTimeout(function(){var k=normalize(location.hash);if(VIEWS[k]){relayoutAll(VIEWS[k]);focusScrollers(VIEWS[k]);}},120);
}

function start(){
 document.documentElement.setAttribute("lang",LANG);
 var skip=document.getElementById("skip");skip.textContent=STR.skip;
 skip.addEventListener("click",function(){var m=document.getElementById("content");m.focus();announce(STR.skip);});
 document.getElementById("nav-programs").setAttribute("aria-label",STR.navMain);
 document.getElementById("nav-views").setAttribute("aria-label",STR.navProgram);
 tipEl=document.getElementById("tip");
 document.addEventListener("mousemove",onTip);document.addEventListener("focusin",onTip);
 document.addEventListener("mouseleave",onTip);document.addEventListener("focusout",onTip);
 // A tooltip that only a mouse can dismiss is a trap for a keyboard reader: Escape closes it, and
 // the next focusin re-opens it for the element that owns it (Audit #12).
 document.addEventListener("keydown",function(e){if(e.key==="Escape")tipEl.hidden=true;});
 if(!ROOM){document.getElementById("content").appendChild(el("p","muted",STR.emptyRoom));return;}
 applyTheme();wireTheme();
 document.getElementById("page-title").textContent=ROOM.meta.title||STR.appTitle;
 document.getElementById("page-stamp").textContent=ROOM.meta.today;
 registerAll();buildNav();stampRunningHead();
 window.addEventListener("hashchange",onHash);
 window.addEventListener("resize",onResize);
 // Printing un-hides every view, so every chart must be drawn before the dialog opens.
 window.addEventListener("beforeprint",function(){
  var k,i;
  for(k in VIEWS)if(VIEWS.hasOwnProperty(k))ensureView(k);
  for(i=0;i<PRINT_FILL.length;i++)PRINT_FILL[i].fill();
  stampPrintIds();
  for(k in VIEWS)if(VIEWS.hasOwnProperty(k)){VIEWS[k].hidden=false;relayoutAll(VIEWS[k]);}
 });
 window.addEventListener("afterprint",function(){
  show(normalize(location.hash));
 });
 onHash();
}
start();
})();
</script>
