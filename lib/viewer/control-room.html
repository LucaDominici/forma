<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma</title>
<style>
:root{color-scheme:dark;
 --bg:#120f0c;--surface:#1c1915;--line:#342f2b;--ink:#ebe7e4;--muted:#98918b;
 --ok:#34a45e;--warn:#bb881a;--bad:#d94543;--accent:#418ad1;--series2:#69625b;
 --ramp1:#2e5072;--ramp2:#326394;--ramp3:#3978b5;--ramp4:#428dd5}
html[data-theme="light"]{color-scheme:light;
 --bg:#f9f6f2;--surface:#ffffff;--line:#dbd7d0;--ink:#1d1a16;--muted:#68625b;
 --ok:#007f3b;--warn:#a66d00;--bad:#c2272d;--accent:#0267c7;--series2:#a9a49c;
 --ramp1:#8cb1e0;--ramp2:#6598d8;--ramp3:#3a7ed1;--ramp4:#0063c5}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
button,a,summary{font:inherit}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:3px}
a:hover{color:var(--accent)}
button{appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:fixed;left:12px;top:10px;z-index:20;padding:8px 12px;background:var(--surface);border:1px solid var(--accent);transform:translateY(-150%)}
.skip:focus{transform:none}
.site-header{max-width:1180px;margin:0 auto;padding:30px 24px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px}
.site-header h1{margin:0;font-size:clamp(20px,2.6vw,30px);line-height:1.1;letter-spacing:-.02em}
.stamp{margin:7px 0 0;color:var(--muted);font-size:13px;font-family:"SF Mono",Menlo,Consolas,monospace}
.nav{position:sticky;top:0;z-index:10;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg)}
.nav-row{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;gap:22px;overflow-x:auto;white-space:nowrap}
.nav-row a{display:block;padding:12px 0;color:var(--muted);font-size:13px;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.nav-row a:hover,.nav-row a:focus-visible{color:var(--accent)}
.nav-row a[aria-current]{color:var(--ink);border-bottom-color:var(--accent)}
.nav-sub{border-top:1px solid var(--line);background:var(--surface)}
.nav-sub .nav-row a{padding:10px 0;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:0 24px 96px}
.view{padding-top:14px}
.brief-section{padding:56px 0;border-top:1px solid var(--line)}
.brief-section:first-child{border-top:0;padding-top:40px}
h2{margin:0 0 26px;font-size:clamp(24px,3.4vw,38px);line-height:1.05;letter-spacing:-.03em}
h3{margin:38px 0 14px;font-size:20px;line-height:1.2;letter-spacing:-.015em}
h4{margin:0;font-size:15px;line-height:1.3}
p{max-width:72ch}
.thesis{max-width:900px;margin:0 0 36px;font-size:clamp(26px,4.6vw,58px);line-height:1.05;letter-spacing:-.035em;font-weight:650}
.section-note,.muted,.chart-note{color:var(--muted)}
.section-note{margin:-14px 0 28px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 2px;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:6px}
.issue-list,.audit-list{border-top:1px solid var(--line)}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:16px 34px 16px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:6px;top:15px;color:var(--muted);font-family:"SF Mono",Menlo,Consolas,monospace}
details[open]>summary:after{content:"−"}
.issue-summary{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:12px}
.issue-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.issue-ref,.data-text{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px}
.issue-ref{color:var(--muted);white-space:nowrap}
.landing-fact{color:var(--muted);font-size:12px;white-space:nowrap}
.issue-title{font-weight:620}
.detail-body{padding:0 34px 20px 0;display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:8px 20px}
.detail-body dt{color:var(--muted);font-size:12px}
.detail-body dd{margin:0;min-width:0}
.tokens{display:flex;gap:6px;flex-wrap:wrap}
.token{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-family:"SF Mono",Menlo,Consolas,monospace}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;white-space:nowrap}
.status-glyph{width:14px;text-align:center;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:15px}
.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}.status-none{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.grid3 details{padding-right:24px}
.grid3 details+details{padding-left:24px;border-left:1px solid var(--line)}
.moving-summary{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.moving-count{font-size:26px;font-weight:650}
.cluster{padding:11px 0;border-top:1px solid var(--line)}
.cluster:first-child{border-top:0}
.cluster-name{display:block;margin-bottom:6px;color:var(--muted);font-size:12px}
.cluster-links{display:flex;gap:8px;flex-wrap:wrap}
.audit-group{margin-top:38px}
.audit-group:first-of-type{margin-top:0}
.audit-group h3{margin-top:0}
.audit-row{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:20px}
.audit-row>span:first-child{color:var(--muted)}
.plain-missing{margin:0;padding:18px 0;border-bottom:1px solid var(--line)}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:40px}
.kpi{background:var(--bg);padding:16px 18px}
.kpi dt{margin:0 0 6px;color:var(--muted);font-size:12px}
.kpi dd{margin:0;font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi dd small{display:block;font-size:12px;font-weight:400;letter-spacing:0;color:var(--muted)}
.map-block{margin-top:38px}
.map-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:12px}
.map-head h3{margin:0}
.map-caption{margin:10px 0 0;color:var(--muted);font-size:12px}
.map-frame{width:100%;height:660px;display:block;border:1px solid var(--line);background:var(--surface)}
.chart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 34px;align-items:start}
.chart{position:relative;margin:0;padding-top:14px;border-top:1px solid var(--line);min-width:0}
.chart.wide{grid-column:1/-1}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}
.chart-toggle{padding:5px 10px;font-size:11px;flex:0 0 auto}
.chart-viz{width:100%;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.mark-accent{fill:var(--accent)}.mark-series2{fill:var(--series2)}.mark-bad{fill:var(--bad)}
.meter-track{fill:var(--accent);opacity:.18}.area-fill{fill:var(--accent);opacity:.18}.area-line{fill:none;stroke:var(--accent);stroke-width:2}
.line-series2{fill:none;stroke:var(--series2);stroke-width:2;stroke-dasharray:4 3}
.svg-label{fill:var(--muted);font:11px "SF Mono",Menlo,Consolas,monospace}
.svg-value{fill:var(--ink);font:11px "SF Mono",Menlo,Consolas,monospace}
.chart-hit{cursor:help;outline:none}
.chart-hit:focus{stroke:var(--accent);stroke-width:2}
.chart-tip{position:fixed;z-index:30;pointer-events:none;max-width:280px;padding:7px 9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px;line-height:1.35}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.tabular-nums{font-variant-numeric:tabular-nums}
.matrix td{vertical-align:top}
.matrix .id{font-family:"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
.hole{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(150px,210px) 1fr;gap:20px}
.hole>span:first-child{color:var(--bad);font-size:12px}
.doc{border-bottom:1px solid var(--line)}
.doc-body{padding:0 0 22px;max-height:520px;overflow:auto;border-left:2px solid var(--line);padding-left:16px}
.doc-body pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font:12px/1.6 "SF Mono",Menlo,Consolas,monospace;color:var(--ink)}
.opt-row{padding:14px 0;border-bottom:1px solid var(--line)}
.opt-flags{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}
.flag{display:inline-block;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
.flag.on{border-color:var(--accent);color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
@media(max-width:820px){
 .site-header{padding:22px 18px 14px}.nav-row,main{padding-left:18px;padding-right:18px}
 .brief-section{padding:44px 0}.brief-section:first-child{padding-top:32px}
 .grid3,.chart-grid{grid-template-columns:1fr}.grid3 details+details{padding-left:0;border-left:0}.grid3 details{padding-right:0}
 .chart.wide{grid-column:auto}.map-head{align-items:flex-start;flex-direction:column;gap:7px}
 .detail-body,.audit-row,.hole{grid-template-columns:1fr;gap:3px}.issue-summary{grid-template-columns:auto 1fr}.issue-title{grid-column:1/-1}
 .map-frame{height:520px}
}
/* Printing must hand over the WHOLE briefing. A hash route is not something anyone can put on
   paper, so every view is un-hidden here — the artifact replaces a deck only if it prints as one. */
@media print{
 .nav,.theme-toggle,.chart-toggle,.chart-tip,.skip{display:none!important}
 .view[hidden]{display:block!important}
 .view{break-before:page}
 .view:first-of-type{break-before:auto}
 .brief-section{break-inside:avoid}
 .doc-body{max-height:none;overflow:visible}
 details{break-inside:avoid}
 details>div,details>dl{display:block!important}
 body{background:var(--bg)}
}
</style>
</head>

<header class="site-header">
 <div><h1 id="page-title"></h1><p class="stamp" id="page-stamp"></p></div>
 <button class="theme-toggle" id="theme-toggle" type="button"></button>
</header>
<nav class="nav" id="nav">
 <div class="nav-row" id="nav-main"></div>

<main id="content"></main>

<div class="chart-tip" id="chart-tip" role="tooltip" hidden></div>

   td=el("td","id");td.appendChild(el("strong","",r.id));td.appendChild(el("div","muted",r.text));tr.appendChild(td);
   tr.appendChild(el("td","",r.role));
   tr.appendChild(el("td","",r.satisfies.join(", ")||"\u2014"));
   tr.appendChild(el("td","",r.verified.join(", ")||"\u2014"));
   td=el("td");for(j=0;j<r.issues.length;j++){td.appendChild(issueLink(program,r.issues[j]));td.appendChild(document.createTextNode(" "));}
   if(!r.issues.length)td.textContent="\u2014";tr.appendChild(td);
   var pr=rtm.progress[r.id];
   tr.appendChild(el("td","tabular-nums",pr&&pr.pct!=null?pr.closed+"/"+pr.issues+" ("+pr.pct+"%)":"\u2014"));
   td=el("td");td.appendChild(docLink(program,r.from,r.line));tr.appendChild(td);
   tbody.appendChild(tr);
  }
  table.appendChild(tbody);wrap.appendChild(table);
  s.appendChild(el("h3","",STR.wbsMatrix));s.appendChild(wrap);

  s.appendChild(el("h3","",STR.wbsHoles));
  var holes=[[STR.wbsDuplicate,rtm.orphans.duplicateIds.map(function(o){return o.id+" ("+o.from+":"+o.line+", "+o.first+")";})],
             [STR.wbsDangling,rtm.orphans.danglingRefs.map(function(o){return o.id+" \u2192 "+o.ref+" ("+o.from+":"+o.line+")";})],
             [STR.wbsUncovered,rtm.orphans.uncovered.map(function(o){return o.id+" \u2014 "+o.text;})],
             [STR.wbsOrphan,rtm.orphans.orphanIssues.map(function(o){return "#"+o.n+" "+o.title;})],
             [STR.wbsSkipped,rtm.skipped.map(function(o){return o.path+" ("+o.why+")";})]];
  var anyHole=false;
  for(i=0;i<holes.length;i++){
   if(!holes[i][1].length)continue;
   anyHole=true;
   var hrow=el("div","hole"),cell=el("span");
   hrow.appendChild(el("span","",holes[i][0]));
   for(j=0;j<holes[i][1].length;j++)cell.appendChild(el("div","",holes[i][1][j]));
   hrow.appendChild(cell);s.appendChild(hrow);
  }
  if(!anyHole)s.appendChild(el("p","muted",STR.wbsComplete));
 }

 s.appendChild(el("h3","",STR.wbsQueue));
 var queue=program.derived.queue,family=summary.taxonomy&&summary.taxonomy.clusterFamily;
 s.appendChild(el("p","chart-note",family?fmt(STR.wbsQueueNote,{family:family}):STR.wbsQueueFlat));
 var open={},k;for(k=0;k<program.issuesSnapshot.issues.length;k++)if(program.issuesSnapshot.issues[k].state==="OPEN")open[program.issuesSnapshot.issues[k].n]=program.issuesSnapshot.issues[k];
 for(i=0;i<queue.clusters.length;i++){
  var cl=el("div","cluster"),links=el("span","cluster-links");
  cl.appendChild(el("span","cluster-name",queue.clusters[i].key));
  for(j=0;j<queue.clusters[i].issues.length;j++){var n=queue.clusters[i].issues[j];if(!open[n])continue;links.appendChild(issueLink(program,n,"#"+n+" "+short(open[n].title,60)));}
  cl.appendChild(links);s.appendChild(cl);
 }
 if(!queue.clusters.length)s.appendChild(el("p","muted",STR.noMoving));
 view.appendChild(s);
}

/* ---------- documents ---------- */
function viewDocs(view,program){
 var s=section("docs-"+program.id,STR.routeDocs),docs=program.docs,i;
 if(!docs||(!docs.embedded.length&&!docs.listed.length)){s.appendChild(el("p","muted",STR.docsNone));view.appendChild(s);return;}
 s.appendChild(el("h3","",STR.docsCanon));
 s.appendChild(el("p","chart-note",fmt(STR.docsBudget,{n:docs.embedded.length,bytes:docs.bytes,max:docs.maxBytes})));
 for(i=0;i<docs.embedded.length;i++){
  var d=docs.embedded[i],det=el("details","doc"),sum=el("summary","issue-summary"),body=el("div","doc-body"),pre=el("pre");
  sum.appendChild(el("span","issue-ref",d.path));
  sum.appendChild(el("span","landing-fact",fmt(STR.docsLines,{n:d.lines})));
  sum.appendChild(el("span","issue-title",d.title||d.path));
  det.appendChild(sum);pre.textContent=d.text;body.appendChild(pre);
  body.appendChild(docLink(program,d.path,null,STR.docsOpen));
  det.appendChild(body);s.appendChild(det);
 }
 if(docs.listed.length){
  s.appendChild(el("h3","",STR.docsOther));
  var wrap=el("div","table-wrap"),table=el("table"),thead=el("thead"),htr=el("tr"),tbody=el("tbody"),heads=[STR.document,STR.docsLines,STR.reason];
  for(i=0;i<heads.length;i++){var th=el("th","",heads[i]);th.setAttribute("scope","col");htr.appendChild(th);}
  thead.appendChild(htr);table.appendChild(thead);
  for(i=0;i<docs.listed.length;i++){
   var l=docs.listed[i],tr=el("tr"),td=el("td");
   td.appendChild(docLink(program,l.path));tr.appendChild(td);
   tr.appendChild(el("td","tabular-nums",l.lines==null?"\u2014":l.lines));
   tr.appendChild(el("td","",l.why==="budget"?STR.docsTooLarge:(l.why||"")));
   tbody.appendChild(tr);
  }
  table.appendChild(tbody);wrap.appendChild(table);s.appendChild(wrap);
 }
 view.appendChild(s);
}

/* ---------- what is in this briefing, and why ---------- */
// A checkbox appears only when the page is being SERVED, because only then is there something on
// the other end that can write the manifest. A file opened from disk shows the same list read-only
// rather than a control that silently does nothing \u2014 a dead switch teaches the reader the page
// lies. `forma room --serve` is what turns them on.
var SERVED=location.protocol==="http:"||location.protocol==="https:";
function toggle(id,enabled,onDone){
 var wrap=el("label","flag"+(enabled?" on":"")),box=document.createElement("input");
 box.type="checkbox";box.checked=enabled;box.style.marginRight="6px";
 wrap.appendChild(box);wrap.appendChild(document.createTextNode(enabled?STR.optYes:STR.optNo));
 box.addEventListener("change",function(){
  var body={};body[id]=box.checked;
  box.disabled=true;
  fetch("/programs",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(body)})
   .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t);});})
   .then(function(){location.reload();})
   .catch(function(e){box.disabled=false;box.checked=!box.checked;onDone(String(e.message||e));});
 });
 return wrap;
}
function viewOptions(view){
 var s=section("options",STR.routeOptions),i;
 s.appendChild(el("p","",fmt(STR.optHowToChange,{file:ROOM.meta.generatedFrom})));
 s.appendChild(el("h3","",STR.optIncluded));
 s.appendChild(el("p","chart-note",STR.optWhat));
 for(i=0;i<ROOM.programs.length;i++){
  var p=ROOM.programs[i],row=el("div","opt-row"),flags=el("div","opt-flags");
  var head=el("div");head.appendChild(el("strong","",p.id));head.appendChild(el("span","muted"," \u2014 "+p.ghRepo));
  if(SERVED){var err=el("span","muted");head.appendChild(document.createTextNode(" "));head.appendChild(toggle(p.id,true,function(m){err.textContent=" "+m;}));head.appendChild(err);}
  row.appendChild(head);
  var has=[[STR.optHasMap,p.hasMap],[STR.optHasHealth,((p.health&&p.health.verdicts)||[]).length>0],[STR.optHasFindings,((p.findings&&p.findings.findings)||[]).length>0],
           [STR.optHasRtm,!!p.derived.rtm],[STR.optHasDocs,!!(p.docs&&p.docs.embedded.length)],[STR.optHasBlockedBy,summaryById(p.id).blockedRule.declared]];
  for(var j=0;j<has.length;j++)flags.appendChild(el("span","flag"+(has[j][1]?" on":""),has[j][0]+": "+(has[j][1]?STR.optYes:STR.optNo)));
  row.appendChild(flags);s.appendChild(row);
 }
 s.appendChild(el("h3","",STR.optExcluded));
 var excluded=ROOM.meta.excluded||[];
 if(!excluded.length)s.appendChild(el("p","muted",STR.optNoneExcluded));
 for(i=0;i<excluded.length;i++){
  var er=el("div","audit-row"),why=el("span");
  er.appendChild(el("span","data-text",excluded[i].id));
  why.appendChild(el("span","",STR.optReasonDisabled));
  if(SERVED){var e2=el("span","muted");why.appendChild(document.createTextNode(" "));why.appendChild(toggle(excluded[i].id,false,function(m){e2.textContent=" "+m;}));why.appendChild(e2);}
  er.appendChild(why);s.appendChild(er);
 }
 view.appendChild(s);
}

/* ---------- routing ---------- */
var ROUTES=[],VIEWS={};
function routeKey(program,tab){return program?"/"+program+"/"+tab:"/"+tab;}
function buildAll(){
 var main=document.getElementById("content"),i,j;
 var tabs=[["exec",viewExec],["tech",viewTech],["map",viewMap],["wbs",viewWbs],["docs",viewDocs]];
 function mount(key){var v=el("section","view");v.id="view-"+key.replace(/[^a-z0-9]+/gi,"-");v.hidden=true;main.appendChild(v);VIEWS[key]=v;ROUTES.push(key);return v;}
 viewPortfolio(mount("/"));
 for(i=0;i<ROOM.programs.length;i++){
  var program=ROOM.programs[i],summary=summaryById(program.id);
  for(j=0;j<tabs.length;j++)tabs[j][1](mount(routeKey(program.id,tabs[j][0])),program,summary);
 }
 viewOptions(mount("/options"));
}
// The pre-tab anchors have to keep working: a link to #now was a valid address for this artifact.
var LEGACY={verdict:"/",now:"/",moving:"/",mismatch:"/",map:null,programs:null};
function normalize(hash){
 var raw=String(hash||"").replace(/^#/,"");
 if(!raw)return "/";
 if(raw.charAt(0)==="/")return VIEWS[raw]?raw:"/";
 if(LEGACY.hasOwnProperty(raw)){
  if(LEGACY[raw])return LEGACY[raw];
  var first=ROOM.programs[0];
  return first?routeKey(first.id,raw==="map"?"map":"exec"):"/";
 }
 return "/";
}
function currentProgram(key){var m=/^\/([^/]+)\/([^/]+)$/.exec(key);return m?m[1]:null;}
function navLink(href,text,current){var a=el("a","",text);a.href="#"+href;if(current)a.setAttribute("aria-current","page");return a;}
function renderNav(key){
 var main=document.getElementById("nav-main"),sub=document.getElementById("nav-program"),subWrap=document.getElementById("nav-sub"),i;
 var program=currentProgram(key);
 main.textContent="";sub.textContent="";
 main.appendChild(navLink("/",STR.routePortfolio,key==="/"));
 for(i=0;i<ROOM.programs.length;i++){
  var id=ROOM.programs[i].id;
  main.appendChild(navLink(routeKey(id,"exec"),id,program===id));
 }
 main.appendChild(navLink("/options",STR.routeOptions,key==="/options"));
 if(!program){subWrap.hidden=true;return;}
 subWrap.hidden=false;
 var tabs=[["exec",STR.routeExec],["tech",STR.routeTech],["map",STR.routeMap],["wbs",STR.routeWbs],["docs",STR.routeDocs]];
 for(i=0;i<tabs.length;i++)sub.appendChild(navLink(routeKey(program,tabs[i][0]),tabs[i][1],key===routeKey(program,tabs[i][0])));
}
function show(key){
 var k;
 for(k in VIEWS)if(VIEWS.hasOwnProperty(k))VIEWS[k].hidden=k!==key;
 renderNav(key);
 var program=currentProgram(key);
 document.title=(ROOM.meta.title||STR.appTitle)+(program?" \u00b7 "+program:"");
}
function onHash(){
 var key=normalize(location.hash);
 show(key);
 // A legacy anchor also has to land on the section it named, not just its view.
 var raw=String(location.hash||"").replace(/^#/,"");
 if(raw&&raw.charAt(0)!=="/"){var target=document.getElementById(raw);if(target&&target.scrollIntoView)target.scrollIntoView();}
}

function applyTheme(){var saved=null,theme;try{saved=localStorage.getItem("forma-room-theme");}catch(e){}theme=saved==="light"||saved==="dark"?saved:(ROOM&&ROOM.meta&&ROOM.meta.theme==="light"?"light":"dark");document.documentElement.setAttribute("data-theme",theme);updateThemeButton(theme);}
function updateThemeButton(theme){var b=document.getElementById("theme-toggle"),next=theme==="dark"?STR.themeLight:STR.themeDark;b.textContent=next;b.setAttribute("aria-label",next);b.setAttribute("aria-pressed",theme==="light"?"true":"false");}
function wireTheme(){document.getElementById("theme-toggle").addEventListener("click",function(){var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("forma-room-theme",next);}catch(e){}updateThemeButton(next);});}

function start(){
 document.documentElement.setAttribute("lang",LANG);
 document.getElementById("skip").textContent=STR.skip;
 document.getElementById("nav-main").parentNode.setAttribute("aria-label",STR.navMain);
 document.getElementById("nav-program").setAttribute("aria-label",STR.navProgram);
 wireChartTips();
 if(!ROOM){document.getElementById("content").appendChild(el("p","plain-missing",STR.emptyRoom));return;}
 applyTheme();wireTheme();
 document.getElementById("page-title").textContent=ROOM.meta.title||STR.appTitle;
 document.getElementById("page-stamp").textContent=fmt(STR.generated,{source:ROOM.meta.generatedFrom,date:ROOM.meta.today})+" \u00b7 "+STR.printAll;
 buildAll();
 window.addEventListener("hashchange",onHash);
 onHash();
}
start();
})();
</script>
