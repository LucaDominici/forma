"],"issues":[]},{"id":"R-8","text":"the whole thing still works","role":"requirement","from":"docs/PRD.md","line":106,"satisfies":[],"verified":["npm test"],"issues":[]},{"id":"R-9","text":"a requirement lands on work, and no work is unclaimed","role":"requirement","from":"docs/PRD.md","line":107,"satisfies":[],"verified":["forma check","rtm","npm test"],"issues":[]}],"byRole":[{"role":"requirement","count":9}],"coverage":{"requirements":9,"withIssues":0,"verifiedOnly":9,"accounted":9,"pct":100},"progress":{"R-1":{"issues":0,"closed":0,"open":0,"pct":null},"R-2":{"issues":0,"closed":0,"open":0,"pct":null},"R-3":{"issues":0,"closed":0,"open":0,"pct":null},"R-4":{"issues":0,"closed":0,"open":0,"pct":null},"R-5":{"issues":0,"closed":0,"open":0,"pct":null},"R-6":{"issues":0,"closed":0,"open":0,"pct":null},"R-7":{"issues":0,"closed":0,"open":0,"pct":null},"R-8":{"issues":0,"closed":0,"open":0,"pct":null},"R-9":{"issues":0,"closed":0,"open":0,"pct":null}},"orphans":{"duplicateIds":[],"danglingRefs":[],"uncovered":[],"orphanIssues":[]},"skipped":[]}},"docs":{"embedded":[{"path":"docs/PRD.md","title":"Forma — product requirements","lines":111,"bytes":6209,"text":"# Forma — product requirements\n\nStatus: living document. Supersedes nothing; it states what the other documents assume.\n\n## 1. The problem\n\nAn architecture diagram is wrong the day after it is drawn, and nobody finds out. The slide keeps\nbeing shown, the wiki page keeps being linked, and the gap between the picture and the code grows\nuntil the picture is worse than nothing, because people still act on it.\n\nEvery existing cure asks for discipline: update the diagram when you change the code. Discipline\ndoes not scale past the second sprint.\n\nThe same failure has a second, worse form. A programme status board (percent complete, green\nboxes, burn-up) is assembled by hand from what people believe. Nobody can re-derive it, so nobody\ncan falsify it. A number that cannot go red is not a measurement, it is an inventory.\n\n## 2. What Forma is\n\nA zero-dependency Node CLI that reads a codebase and produces two things:\n\n1. an interactive C4 architecture explorer, generated from the code rather than drawn;\n2. a Control Room: a portfolio briefing over one or more programmes, built only from facts that\n   can be re-derived offline.\n\nAnd, holding both honest, a deterministic gate (`forma check`) that fails loudly when any of it\nstops matching the code.\n\nThe product is not the picture. The product is **the picture plus the reason to believe it.**\n\n## 3. Who it is for\n\n| User | What they need | What they get |\n|---|---|---|\n| The engineer who owns a system | to explain it without maintaining a diagram | an explorer generated from the code, and a gate that fails in CI when it drifts |\n| The person deciding what to do next | to know what actually needs them, across everything they run | a briefing that ranks the few open items and cites the evidence for each |\n| An AI agent driving the tool | a contract it can hold, not a UI it must guess | documented JSON and Markdown files; every command is a plain Node script |\n| A reviewer or stakeholder | to trust a claim without reading the code | every claim on screen carries a citation that resolves |\n\nForma is model-agnostic on purpose: no agent, model or vendor is required. A human with no AI can\ndrive every command, and an agent drives the same contract.\n\n## 4. The one requirement everything else serves\n\n> Every number, verdict, cluster and colour on screen must be re-derivable from raw inputs by an\n> offline command, and that command must fail when the artifact disagrees.\n\nConsequences, all of them binding:\n\n- **Code proves existence, never completion.** Walking `src/` tells you a file is there. It does\n  not tell you the feature works. Forma refuses to derive a completion percentage from structure.\n- **Unknown is a value.** A node nobody ruled on stays `unknown` and renders as a blank, never as\n  a zero and never as a green.\n- **A declaration is not a measurement.** A document saying \"done\", or a closed issue, is a claim\n  someone made. Forma may show it, labelled as what it is, but the publication gate refuses a\n  percentage whose only provenance is a declaration.\n- **No colour without a reason.** A verdict carries a `why` and at least one evidence reference\n  that resolves, or it is rejected at write time.\n- **Silence is a defect.** A cap, a truncation, an excluded commit or a dropped document is\n  counted and named. Anything the tool leaves out, it says out loud.\n\n## 5. Scope\n\n**In scope.** Generating the model from code; curating it through documented JSON; deriving state\nfrom the repository's own capability tables; refreshing issue state from GitHub; linking issues to\ncode through git; composing a portfolio briefing; and gating all of it.\n\n**Out of scope, deliberately.**\n\n- Runtime dependencies. Ever. This is a hard constraint, not a preference (ADR-0001).\n- Any network access outside `forma verify` and the opt-in `gen --enrich`.\n- Inventing programme state. What no document, issue or commit names stays unknown.\n- Project management. Forma reads issues, it does not manage them.\n- Being a diagram editor. The layout serves reading, not drawing.\n\n## 6. How each requirement is verified\n\nA requirement with no command behind it is a wish. Each of these is runnable.\n\nThe `id` column is not decoration. It is the first link of the traceability chain `lib/rtm.mjs`\nreads: a requirement here is satisfied by a decision in [`DESIGN.md`](DESIGN.md), proved by a row in\n[`DELIVERY.md`](DELIVERY.md), and worked by GitHub issues. Where a programme's manifest declares an\n`rtm` block, `forma check` fails on a requirement that lands on nothing and on open work no\nrequirement claims — which is the only way \"the issues are the whole of the work\" can be checked\nrather than asserted.\n\n| id | requirement | verified by |\n|---|---|---|\n| R-1 | the model matches the code | `forma check` re-walks `src/` and compares |\n| R-2 | the model matches its own contract | `validateModel` against `lib/schema/c4-model.schema.json`, run inside `gen` and `check` |\n| R-3 | a generated document does not drift | `check` re-renders the governed block and compares |\n| R-4 | a derived state still derives | `check` recomputes from the source document and fails if the row is gone |\n| R-5 | the artifact is worth projecting | `scripts/presentable.mjs`, five predicates |\n| R-6 | the briefing keeps its promises | `scripts/room-presentable.mjs`, including a byte-identical re-render |\n| R-7 | a verdict is anchored | `applyVerdicts` refuses an unresolvable reference; `check` re-checks on disk |\n| R-8 | the whole thing still works | `npm test`, fixtures driven through the real CLI |\n| R-9 | a requirement lands on work, and no work is unclaimed | `forma check` with an `rtm` block declared; `npm test`, the `rtm` block |\n\n## 7. What success looks like\n\nForma is succeeding when a stranger can clone a repository, run three commands, and get a picture\nthey can defend in a meeting; and when the person who runs it every day opens the briefing and\nlearns something they did not already know, in the first ten seconds.\n\nIt is failing, regardless of how it looks, the moment a number on screen cannot be traced back to\nsomething a machine can check.\n\n## 8. Related documents\n\nRead [`docs/README.md`](README.md) for the reading order.\n"},{"path":"docs/DESIGN.md","title":"Design","lines":217,"bytes":12337,"text":"# Design\n\nThe choices that shaped Forma, and the alternatives that were rejected. A decision with no\nrecorded alternative is indistinguishable from an accident.\n\nDecisions with lasting architectural consequence get an ADR in [`adr/`](adr/). This file holds the\nreasoning that is too broad for one ADR, and the roads not taken.\n\n---\n\n## D1. Generate the model, curate the meaning\n\n**Choice.** `gen` derives structure from code, and everything a machine cannot know (what a\ncontainer is *for*, which packages form a domain, what state a module is in) comes from curated\nJSON that a human or an agent edits.\n\n**Rejected: derive everything.** Tried and measured. On a real 53-package Go repository the fully\nderived container level is a 7 by 8 wall in which 85 to 91 percent of the 189 arrows cross boxes\nthat are not their endpoints, at any grid shape. The layout cannot solve it; only drawing fewer\nboxes can, and choosing which boxes is judgement.\n\n**Rejected: curate everything.** Then it is a diagram again, and it rots.\n\n**Cost, stated.** Grouping 53 packages into six domains was about 89 seconds of scripted editing\nand 30 to 60 minutes of thinking by someone who knows the repository. That is the real price, and\nit is charged once per repository, not once per change.\n\n## D2. The gate re-derives rather than trusts\n\n**Choice.** `check` recomputes the truth from raw inputs and compares. It never accepts a\ncommitted number, and it never reads the artifact it is checking.\n\n**Rejected: checksums.** A hash proves the file did not change. It cannot notice that the file was\nalways wrong, which is the failure that matters.\n\n**Rejected: parsing the generated HTML.** It works on the day it is written and drifts the first\ntime the template moves. That is why `lib/roomderive.mjs` exists as one module shared by the\ncomposer and the gate: if they computed differently, the gate would prove nothing.\n\n## D3. Overlays, not a wider schema\n\n**Choice.** New kinds of fact get their own file with their own lifecycle: `c4-status.json`,\n`c4-issues.json`, `c4-health.json`, `c4-findings.json`.\n\n**Rejected: adding fields to the node.** The model's root and node objects are\n`additionalProperties: false` on purpose. More importantly, these facts have different lifetimes:\nstructure changes when code changes, issue state changes hourly, an audit verdict is a dated\njudgement. One file holding all three would be stale in at least one dimension at all times.\n\n**Consequence accepted.** More files to explain. The reading map in [`README.md`](README.md)\nexists because of this decision.\n\n## D4. Issues link to code through git, and only through git\n\n**Choice.** An issue reaches a C4 node because a commit citing it touched a file that node owns.\n\n**Rejected: a curated map.** It would be more precise per entry and would not scale past a few\ndozen, and it would be a second authority on the same fact.\n\n**Rejected: labels.** `domain:backend` tells you where somebody said they were working, not where\nthe work landed.\n\n**Measured.** Coverage is 69 percent on haben, 54 on arbiter, 56 on viafera. The remainder stays\nunknown. Partial and honest beat complete and invented.\n\n**Two rules the data forced.** A commit touching more than a threshold of files attributes to\nnothing, because a sweep is not a change (1 to 3 percent of commits, p99 64 to 101 files). And a\n`#N` preceded by a word character belongs to another repository: `viafera#3807` cited inside a\nhaben commit does not resolve as a haben issue at all.\n\n## D5. A briefing, not a dashboard\n\n**Choice.** One reading order, thesis first, evidence expanding in place, covering the whole\nportfolio.\n\n**Rejected: tabs.** Tabs file content by category, but the Control Room is one dataset in several\nprojections. Filing it hides the thing that makes it different from any other dashboard: every\nclaim can be drilled to its proof. Following evidence is the natural movement, so the structure\nshould be evidence, not cabinets.\n\n**Rejected: one artifact per repository.** Measured across three real programmes: 4141 issues, 53\nopen, 11 waiting on a human. The question worth answering is which of the 11, and a per-repository\nartifact forces the reader to hold the comparison in their head.\n\n**Consequence accepted.** A single file now concentrates issue titles, labels and architecture for\nseveral private repositories. That is a more sensitive artifact than the three separate ones, and\npublishing it is a decision its owner has to make deliberately.\n\n## D6. Colour means evidence\n\n**Choice.** Saturation is reserved for claims that carry a resolvable reference. Everything else is\nneutral ink on a neutral ground. The reader can scan for colour, and every coloured thing is\ncheckable.\n\n**Why this and not a house style.** It makes the product's doctrine visible instead of merely\ndocumented. It also rules out the two reflexes a tool like this falls into: the navy-blue developer\ndashboard and the green-on-black terminal.\n\n**Verified, not judged by eye — and for a while that was not true.** This paragraph used to claim\nboth palettes had been run through \"the measurement script\". No such script was in the repository,\nand `scripts/presentable.mjs` carried no colour predicate, so nobody could reproduce the claim.\nWriting [`scripts/palette.mjs`](../scripts/palette.mjs) and running it found what the claim was\nhiding: four contrast failures in the briefing, four more in the explorer, a pure `#ffffff`, and a\nstatus trio whose worst pair measured **3.1**, not the 6 to 8 this paragraph asserted.\n\n**What the measurement says now.** Every token is OKLCH, and the numbers below come out of\n`node scripts/palette.mjs`, which `npm test` runs.\n\n| Measure | Briefing dark | Briefing light | Explorer holo | Explorer blueprint |\n|---|---:|---:|---:|---:|\n| lowest text ratio | 4.70:1 | 4.61:1 | 4.61:1 | 4.61:1 |\n| lowest chart-mark ratio | 3.25:1 | 3.20:1 | 3.21:1 | 3.21:1 |\n| worst status pair under CVD | 7.2 | 8.5 | 7.2 | 8.5 |\n\nThe trio is separated by **lightness on purpose**, because lightness is the one channel that\nsurvives colour-blind vision: before, `ok` and `bad` sat within 0.02 of each other in OKLCH L and\ncollapsed to a separation of 4.2 under simulated deuteranopia. Even so, the worst pair stays inside\nthe ambiguous band, which is legal *only* with a secondary encoding — so the script also reads\n`statusMark()` out of the shipped template and fails if the glyph or the word ever stops rendering.\nTwo halves of one rule, both enforced.\n\n**The embedded explorer is not a second look.** `blueprint`, the skin the Control Room puts in its\nmap view, was a cold blue-grey inside a warm briefing and had a recorded defect where its statuses\n\"read alike\". It is now literally the briefing's light palette mapped onto the explorer's token\nnames. The `holo` skin keeps its own identity: it is the standalone artifact, with its own audience.\n\n**Consequence.** Most charts are emphasis (one accent against a de-emphasis grey) or a single hue.\nThere is deliberately no categorical palette, because no view needs to tell many nominal series\napart.\n\n**Paper is the third palette, and declaring it was not enough.** Setting only `body{color:#000}` had\nleft every token at its dark value, so chart numbers printed at 1.23:1 against white. Declaring a\nprint palette fixed the numbers and not the output: a media query adds no specificity, so\n`@media print{:root{…}}` scores (0,1,0) and `html[data-theme=\"light\"]` scores (0,1,1) and wins.\nEvery reader who had ever pressed the theme button printed the screen palette, and the dark case\npassed only by tying the base `:root` on source order. The measurement script was reading the\ndeclaration and reporting a number half the readers never got — the same defect as the missing\nscript, one layer in. It now derives every rule in a file that declares the ground token and fails\nif any of them ties or beats the print rule.\n\n| Measure | Briefing print |\n|---|---:|\n| lowest text ratio | 4.97:1 |\n| chart values (`.svg-value`) | 17.32:1 |\n| provenance and axis labels | 7.78:1 |\n\n- **Enforced by:** `node scripts/palette.mjs --check`, inside `npm test`.\n- **Red when:** a text token drops below 4.5:1 or a chart mark below 3:1 against either ground; a\n  pure `#000`/`#fff` appears; chroma is pushed against the ends of the lightness range; the status\n  trio is ambiguous under CVD while the glyph-and-word encoding is gone; or a theme selector reaches\n  the specificity of the print palette, so that what is measured is not what applies.\n\n## D10. The screen is the frame, and the floor is declared\n\n**Choice.** The briefing is an application in a fixed shell — `100dvh`, one 52px bar, panels that\nscroll inside themselves — and not a document that scrolls. Width earns columns: two below 1500px,\nthree to 2299, four above. There is no `max-width`.\n\n**Why.** Measured before the redesign, on the smallest possible fixture: the executive view ran\n1385px past a 1920×1080 screen, 2.3 screenfuls; and on a 3440px monitor `main` was 1180px wide, so\n2260px — 66% of the display — was blank. That is the worst of both, wasting the axis you have and\noverflowing the one you do not.\n\n**The floor is 1920×1080 as a viewport, which is ~900px of real `innerHeight`.** Browser and system\nchrome take 130–200px off an FHD monitor, so designing against 1080 is designing against a screen\nnobody has. The budget is 900 − 52 bar − 32 padding ≈ **815px of content**.\n\n**At the floor the evidence tier scrolls inside its own frame, and that is the design, not a\nshortfall.** At 1920×900 the portfolio view holds 476px of evidence in a 376px frame: 100px sit\nbehind an internal scrollbar rather than lengthening the page. Every view answers its question in\nthe fixed tier above; the tier that scrolls is the supporting evidence. On a 3440×1440 monitor the\nsame content fits with nothing hidden, which is how the extra pixels pay: more answer, not more\nwhite.\n\n**Below the floor the shell is released rather than crushed** — the page scrolls, and it is a\ndeliberate exit. The two arms are separate rules: below 1199px wide the layout also collapses to one\ncolumn, because it is narrow; below 761px tall it keeps whatever columns the width earned, because\nit is only short. Folding them together turned a half-height ultrawide into a single 3381px column\nwith a 2096px document.\n\n**Rejected: a height that adapts by hiding.** Dropping panels at small heights would make the\nbriefing say different things on different screens, and a briefing that omits without saying so is\nthe artifact this product exists to replace.\n\n- **Enforced by:** measurement in a real browser, in CI, not by a regex over CSS text in `npm test`\n  — a pattern match cannot fail for the right reason. See [`docs/technical-debt.md`](technical-debt.md).\n- **Red when:** any route overflows the viewport at 3440×1440 or 1920×900.\n\n## D7. Determinism over freshness\n\n**Choice.** `today` comes from the manifest. No derivation path reads a clock.\n\n**Rejected: the system clock.** Convenient, and it makes the gate non-reproducible: the same inputs\nwould produce different verdicts on different days, so a failure could never be trusted.\n\n**Cost, stated.** The manifest must be updated for the dates to be meaningful, and a stale `today`\nproduces a confidently wrong \"days ago\". `room-presentable` therefore fails on a snapshot older\nthan a declared threshold.\n\n## D8. Refuse rather than degrade\n\n**Choice.** `room` refuses to build on a truncated issue snapshot. `applyVerdicts` throws on an\nunresolvable reference. `check` fails on a stale registered document.\n\n**Rejected: warn and continue.** The whole product exists because a wrong picture that keeps being\nshown is worse than no picture. Building the artifact anyway, with a warning nobody reads in a log\nnobody keeps, reproduces exactly that failure.\n\n## D9. Wording is part of the contract\n\nTwo examples where a name was chosen to make misuse hard.\n\n- `closureRate`, never `completion`. Closed over total is a measurement of issue closure, not of\n  work being finished, and the publication gate enforces the distinction.\n- `daysSinceLastLanding`, never `waitingDays`. Git knows when work landed; it does not know when\n  someone started waiting. The interface says \"last work N days ago\" for the same reason.\n"},{"path":"docs/GLOBAL_INVARIANTS.md","title":"Global invariants","lines":197,"bytes":9645,"text":"# Global invariants\n\nThe rules Forma does not break. Each one names where it is enforced and what turns red when it is\nviolated. An invariant with no enforcement is a preference, and preferences do not belong here.\n\nRead this before changing anything in `lib/`.\n\n---\n\n## I1. Zero runtime dependencies\n\n`package.json` has no `dependencies` and never will. Everything is Node stdlib: the JSON Schema\nwalker, the layout, the renderers, the charts.\n\n- **Enforced by:** `scripts/lint.mjs` runs `node --check` over the tree; `npm pack --dry-run`\n  ships `bin/`, `lib/`, and three text files. ADR-0001.\n- **Red when:** a dependency appears; the package grows a `node_modules` requirement.\n- **Why:** an architecture tool that rots because its charting library moved on has proven the\n  point it exists to disprove.\n\n## I2. Only `verify` touches the network\n\n`gen`, `check`, `doc`, `serve` and `room` never open a socket. `gen --enrich` is the one opt-in\nexception and requires an explicit flag plus a key.\n\n- **Enforced by:** `lib/verify.mjs` is the only module importing a network path; `lib/room.mjs`\n  reads a snapshot that must already exist.\n- **Red when:** a fetch appears in an offline command; `check` behaves differently with the\n  network down.\n- **Why:** a gate that can fail because of DNS is not a gate.\n\n## I3. `gen` is the only writer of the model\n\n`verify` writes exactly one model field (`meta.verifiedAt`) plus node state. `room` and `check`\nnever write the model at all.\n\n- **Enforced by:** `lib/verify.mjs` (the comment at the `meta.verifiedAt` assignment states it);\n  `lib/room.mjs` opens the model read-only.\n- **Red when:** two commands can produce a different model from the same inputs.\n- **Why:** two writers means the file is nobody's.\n\n## I4. Nothing that survives a regeneration may live only in the model\n\n`gen` rebuilds the model from the topology and overlays. Anything else it holds is transient.\n\n- **Enforced by:** the fact base lives in its own file under `docs/architecture/`, written only by `forma verify`, which\n  `gen` never touches.\n- **Red when:** a fact disappears after a routine `forma gen`.\n- **Why:** discovered the hard way: `verify` used to decorate the model, and every decoration died\n  at the next generation.\n\n## I5. Code proves existence, never completion\n\n`gen` sets `status2` to `unknown` for anything it merely found. A percentage may only come from a\ndocument or an overlay that a human or an agent wrote, and it carries its citation.\n\n- **Enforced by:** `lib/gen.mjs` at the `status2` default; `scripts/presentable.mjs` predicate 5\n  refuses a percentage whose citation does not positively claim a measurement.\n- **Red when:** a box turns green because a file exists.\n\n## I6. Unknown renders as a blank, never as a zero\n\nA node nobody ruled on, a program without a curated map, an issue git never saw: all of these\nreport `null`, and the interface says so in words.\n\n- **Enforced by:** `lib/roomderive.mjs` returns `null` (not `0`) for every aggregate that needs a\n  model the program does not have; the viewer's neutral status class.\n- **Red when:** a zero appears where nothing was measured. Zero claims \"measured and none\", which\n  is a different and stronger statement.\n\n## I7. Absent is not the same claim as empty\n\nA rule nobody declared and a rule declared as empty are different facts and must stay distinct.\n\n- **Enforced by:** `lib/roomderive.mjs` counts programs with no declared `blockedBy` into\n  `totals.unknownRule` rather than into the unblocked count.\n- **Red when:** \"nobody checked\" is rendered as \"checked, none\".\n- **Why:** measured on three repositories: haben declares `needs-human`, arbiter declares\n  `needs-human` and `owner-decision`, viafera has no such label at all.\n\n## I8. No colour without a resolvable reason\n\nEvery health verdict carries a non-empty `why` and at least one evidence reference. A `path` must\nexist on disk; a `commit` must resolve in git.\n\n- **Enforced by:** `applyVerdicts` in `lib/audit.mjs` throws rather than skipping; `lib/check.mjs`\n  re-checks every reference; `scripts/room-presentable.mjs` fails on an unresolvable one.\n- **Red when:** a verdict is written whose evidence points at nothing.\n\n## I9. Nothing is dropped silently\n\nEvery cap, exclusion and truncation is counted and named where a reader can see it.\n\n- **Enforced by:** `lib/link.mjs` records `excludedSweeps` with sha and file count;\n  `lib/verify.mjs` sets a required `truncated` flag and warns; `lib/room.mjs` refuses to build on\n  a truncated snapshot.\n- **Red when:** a number quietly describes a subset.\n- **Why:** measured, a fetch returned 1200 of 2246 issues and said nothing. Every proportion built\n  on it would have been false.\n\n## I10. The gate re-derives, it never trusts\n\n`check` recomputes from raw inputs and compares. It never parses the generated HTML, and never\ntakes a committed number at face value.\n\n- **Enforced by:** `lib/check.mjs` imports the same `lib/roomderive.mjs` the composer uses and\n  compares against a machine-readable block, not against markup.\n- **Red when:** a check reads the artifact it is supposed to be checking.\n\n## I11. New gating is opt-in by presence\n\nA repository that never adopted a feature sees no new failure mode from it.\n\n- **Enforced by:** the pattern of `topo.countChecks || []` and `existsSync(statusPath)`, followed\n  by every Control Room assertion in `lib/check.mjs`.\n- **Red when:** adding a capability turns an unrelated repository's gate red.\n\n## I12. Determinism: the only clock is the manifest\n\nNothing in the derivation path calls `Date.now()` or `new Date()` with no argument. `today` comes\nfrom `forma.room.json`. `gen` has exactly one volatile field, `generatedAt`.\n\n- **Enforced by:** `test/run.mjs` compares two consecutive `gen` runs and allows exactly one field\n  to differ; `room-presentable` re-renders and compares bytes.\n- **Red when:** two runs on unchanged inputs differ.\n\n## I13. Nothing in `lib/` knows any project's names\n\nNo node id, directory, label or stack of any specific repository appears in the engine. Anything\nproject-specific is declared in a manifest or a topology.\n\n- **Enforced by:** `CONTRIBUTING.md`; the per-program `blockedBy` and `taxonomy` fields exist\n  precisely so `needs-human` is not hardcoded.\n- **Red when:** a grep for a project's vocabulary hits `lib/` or `bin/`.\n\n## I14. Repository-controlled text never becomes markup\n\nModel prose, issue titles, finding text and document bodies are all attacker-adjacent input.\n\n- **Enforced by:** `lib/room.mjs` escapes `\u003c` as `\u003c` in injected JSON and `\u003c/script` in the\n  inlined viewer; the embedded frame runs `sandbox=\"allow-scripts\"` without `allow-same-origin`.\n- **Red when:** a `\u003c/script>` in a description closes the script element. There is a test that\n  plants exactly that.\n\n## I15. Every UI string exists in both locales, and every declared string is used\n\nThe single-lens viewer keeps its `STRINGS` literal; the Control Room's tables are\n`lib/viewer/strings/{en,it}.json`. Both stay at parity, and the Control Room's are additionally\nchecked for keys nothing reads — dead weight a translator still has to carry.\n\n- **Enforced by:** `test/run.mjs` compares the viewer's key counts, and compares the two JSON files\n  key by key plus greps the template for every one of them.\n- **Red when:** a string is added to one locale only, or a key survives the view that used it.\n- **Note:** this rule claimed to cover the Control Room long before it did. The parity half was only\n  ever true of the viewer until the tables became files.\n\n## I16. Traceability is measured, never inferred\n\nA requirement traces to a decision, a verification or an issue because a cell in a document says\nso. Forma measures how much of that is covered and names what is not, at both ends: a requirement\nthat lands on nothing, and open work no requirement claims.\n\n- **Enforced by:** `lib/rtm.mjs` reads only declared references; `lib/check.mjs` fails on a\n  duplicate id, a reference that resolves to nothing, an uncovered requirement, an orphan open\n  issue, and a declared document that contributed no rows.\n- **Red when:** a matrix is missing a link at either end — or a document quietly stops contributing,\n  which is how a matrix empties while still looking full.\n\n## I17. History is derived, never stored\n\n\"Where we were\" comes out of the same snapshot as \"where we are\": an issue was open on a day when\nit existed and was not yet closed. No register, no second fetch, and the only clock is\n`manifest.today`.\n\n- **Enforced by:** `deriveHistory` in `lib/roomderive.mjs` reads `createdAt`/`closedAt` and returns\n  `null` — not an empty series — when the snapshot predates those fields; `check` re-derives it.\n- **Red when:** a briefing shows a flat line where it should say the snapshot cannot answer, or a\n  series that changes without its inputs changing.\n\n## I18. The only file a briefing writes is the manifest\n\n`forma room --serve` exists because a page of checkboxes cannot write a file. It binds loopback,\naccepts one field per programme (`enabled`), and re-validates the whole manifest against its schema\nbefore writing, so a rejected edit leaves the file exactly as it was.\n\n- **Enforced by:** the `PUT /programs` handler in `lib/room.mjs`; `npm test` asserts the bind is\n  loopback.\n- **Red when:** anything else becomes writable through the page, or a rejected edit lands half-applied.\n\n---\n\n## How to add an invariant\n\nDo not add one here until it has an enforcement point. Write the check first, watch it fail on\npurpose, then write the row. A rule that has never been seen to go red is a rule nobody knows\nworks.\n"},{"path":"docs/DELIVERY.md","title":"Delivery status","lines":82,"bytes":13576,"text":"# Delivery status\n\nThis file records realization status for the Control Room branch. A feature is listed as proven only when a named command or recorded measurement can falsify it. Built code without that evidence stays in the next section.\n\n## What is shipped and proven\n\n| Claim | Proof command or recorded check | Why the proof is relevant |\n|---|---|---|\n| The public CLI dispatches `init`, `gen`, `check`, `doc`, `serve`, `verify`, `scan`, and `room`. | `node bin/forma.mjs --help` | The dispatcher is the package entry point, so this proves the installed command surface ([`bin/forma.mjs:15-38`](../bin/forma.mjs#L15-L38)). |\n| The shipped JavaScript entry points parse. | `npm run lint` | This passes on the branch and checks 25 files through `node --check`. |\n| Forma's own committed model is adherent to Forma's current source. | `node bin/forma.mjs check` | This passes on the branch and independently re-walks source, document facts, evidence, and optional artifacts. |\n| The npm selection is clean of editor residue and includes the Control Room runtime files. | `npm pack --dry-run --json` | The prepack guard passes and the dry run lists `room.mjs`, `roomderive.mjs`, the four overlay or manifest schemas, and `control-room.html`. |\n| The single-model public demo meets its five publication predicates. | `node scripts/presentable.mjs docs/demo/c4-model.json` | The suite grades the shipped model itself, not a cleaned copy ([`test/run.mjs:1407-1411`](../test/run.mjs#L1407-L1411)). |\n| `verify` fetches a whole-programme issue and milestone fact base, detects likely truncation, and writes only after parsing. | `forma verify`, exercised offline by the `gh` stub inside `npm test` | The test reaches the verify block and reports it green before the later known failure; the write boundary is visible at [`lib/verify.mjs:55-84`](../lib/verify.mjs#L55-L84). |\n| Issue-to-code linkage uses git history without a second curated map or an LLM. | `forma room`, then inspect the generated linkage coverage; re-run `forma check` | The same `link.mjs` and `roomderive.mjs` path feeds composer and checker, and coverage was measured on three real repositories. |\n| The Control Room composer validates inputs, rejects truncated snapshots, and writes one self-contained HTML briefing. | `forma room --manifest \u003cforma.room.json> --out \u003ccontrol-room.html>` | Composition is read-only over its inputs and embeds both the room data and sandboxed explorer ([`lib/room.mjs:36-65`](../lib/room.mjs#L36-L65), [`lib/room.mjs:89-106`](../lib/room.mjs#L89-L106)). |\n| Room aggregates are not trusted from rendered markup, and the gate fails when they are altered. | `npm test` (the `room` block) | `check` re-derives every key of `deriveAll` per programme and compares it to the embedded machine-readable block; the test alters one aggregate by hand on both a mapped and a map-less programme and requires `check` to exit 1 naming the programme and the field ([`lib/check.mjs:226-278`](../lib/check.mjs#L226-L278)). |\n| The publication instrument runs every predicate and compares a second render byte for byte. | `npm test` (the `room` block), or `node scripts/room-presentable.mjs --room \u003chtml> --manifest \u003cjson>` | The test runs the instrument against a freshly composed briefing and requires exit 0; determinism is asserted twice, once by the test comparing two renders and once by the instrument re-rendering from the same manifest ([`scripts/room-presentable.mjs:96-110`](../scripts/room-presentable.mjs#L96-L110)). |\n| The briefing derives a programme that has no architecture model. | `npm test` (the `room` block) | A programme carrying only issues and git history still yields KPIs, milestones, Kanban buckets and a queue; the two map-dependent answers read `null`, never a measured zero ([`lib/roomderive.mjs:107-131`](../lib/roomderive.mjs#L107-L131)). |\n| Audit verdicts cannot be applied without resolvable evidence. | Call `auditPlan`, apply fills with `applyVerdicts`, then run `forma check` | Paths must exist, commits must resolve, and unknown evidence types are rejected before merge ([`lib/audit.mjs:32-58`](../lib/audit.mjs#L32-L58)). |\n| Requirements trace to work, and the gate fails at both ends. | `npm test` (the `rtm` block) | The test edits the fixture's design document four ways — a duplicate id, a reference to nothing, a decision landing on no work, and open work no requirement claims — and requires `forma check` to exit 1 each time, naming the document and the line ([`lib/rtm.mjs`](../lib/rtm.mjs), [`lib/check.mjs`](../lib/check.mjs)). |\n| The convention survives a document written by hand for prose reasons. | `npm test` (the `rtm-dogfood` block) | Forma's own `docs/PRD.md` §6 parses as nine traceable requirements, each carrying its verification and its source line, and parsing it twice gives an identical answer. |\n| \"Where we were\" needs no stored history. | `npm test` (the `views` block) | The whole series is a count over `createdAt`/`closedAt` in one snapshot; a snapshot predating those fields derives `null` rather than a flat line ([`lib/roomderive.mjs`](../lib/roomderive.mjs)). |\n| A checkpoint carries completion that was measured, not estimated. | `npm test` (the `views` block) | Completion is issue closure on the nodes the checkpoint patches; a checkpoint no issue reaches reads `null`, never 0%. |\n| The document budget refuses rather than truncates. | `npm test` (the `views` block) | With a one-byte budget nothing is embedded and every canon document is listed with the budget as its reason. |\n| Discovery never overturns a decision. | `npm test` (the `scan+serve` block) | A second `forma scan` over the same root leaves `enabled: false`, hand-curated fields and `today` untouched. |\n| The served briefing writes the manifest and nothing else. | `npm test` (the `scan+serve` block), plus `forma room --serve` | It binds loopback only; the handler accepts one boolean per programme and re-validates the whole manifest before writing, so a rejected edit leaves the file byte-identical. |\n\n`npm test` is green, with nothing skipped. It was not, and the reason is recorded under known defects below.\n\n## What is built but not yet proven on a second repository\n\n- The room manifest can describe multiple programmes and allows a programme to omit its model and topology. This is implemented and validated, but only `haben` has exercised the full mapped pipeline. `arbiter` and `viafera` have measured issue corpora but no curated Forma model, so manifest parametricity across independently curated architectures remains unproved ([`docs/SCOPE-room.md:51-59`](SCOPE-room.md#L51-L59), [`docs/SCOPE-room.md:106-108`](SCOPE-room.md#L106-L108)).\n- Portfolio aggregation across programmes is built and was measured over three issue corpora. That proves counting and declared blocking rules, not that a coherent briefing can be produced for a second mapped repository by changing only the manifest.\n- Automatic taxonomy detection was measured across three repositories. It remains syntactic pattern matching, so each new repository still needs review of aliases, exclusions, minimum population, and severity order.\n- The evidence-gated health audit proves rejection mechanics. It does not prove that every human or agent verdict is substantively correct; the mechanism validates anchors, not judgment.\n- Control Room publication is not proven. The generated artifact remains a review artifact, and no Pages or other deployment consumes it.\n\n## What is deliberately not built, and why\n\n- **A curated `c4-blocks.json`.** The automation queue is derived from issue, milestone, and label facts. A second file would duplicate those facts before a real unrepresentable case exists.\n- **Automatic curation of a second repository model.** Grouping and naming architecture are human judgments. Treating curation as a code change would turn an unproved interpretation into apparent fact.\n- **Semantic label understanding.** Taxonomy recognizes `name:value` and `name/value` families plus declared aliases. It does not guess that differently cased or differently named values are equivalent, because that would hide project-specific meaning.\n- **A network path outside explicit fact or prose acquisition.** `verify` owns live GitHub facts. Optional enrichment owns only prose holes. Generation, checking, room composition, linkage, taxonomy, and audit application remain offline so repeated gates are deterministic.\n- **Offline proof of snapshot freshness.** A snapshot can be well formed and within a declared age while GitHub has already changed. Only a new `verify` can refresh the fact base.\n- **A zero-staleness requirement for `source.commit`.** The architecture layer is regenerated on demand. The room reports how many commits it is behind when resolvable, but does not fail merely because normal development moved HEAD.\n- **Control Room publication.** Issue titles, labels, and milestones disclose more than package names. The disclosure decision is still open, so publication is blocked while local composition remains allowed ([`docs/SCOPE-room.md:74-80`](SCOPE-room.md#L74-L80)).\n- **New language adapters or graph heuristics.** This scope extends rendering and evidence, not source-language analysis. Existing declared-language and fallback behavior remains unchanged.\n\n## The measured numbers\n\nAll numeric entries in this table come from the seven branch commit messages or `docs/SCOPE-room.md`. No value is extrapolated.\n\n| Measurement | Value | Source and meaning |\n|---|---:|---|\n| Real repositories in the portfolio measurement | 3 | `haben`, `arbiter`, and `viafera`, from the portfolio derivation commit. |\n| Issues in that portfolio corpus | 4,141 | Whole-programme issue snapshots across those three repositories. |\n| Open issues in that corpus | 53 | Count reported by the portfolio derivation commit. |\n| Issues waiting on a human | 11 | Uses a declared rule per programme, never a global inferred label. |\n| `haben` issue-to-code coverage | 69% | Issues with at least one linked modeled node, measured 2026-08-09. |\n| `arbiter` issue-to-code coverage | 54% | Same definition and date. |\n| `viafera` issue-to-code coverage | 56% | Same definition and date. |\n| `haben` open issues in the worked audit | 5 | Scope caveat for the worked example. |\n| `haben` open issues labeled `needs-human` | 4 of 5 | A judgment boundary, not a code-completeness claim. |\n| `arbiter` truncation probe | 1,200 returned of 1,429 | Evidence that `gh --limit` can silently truncate. |\n| `viafera` truncation probe | 1,200 returned of 2,246 | Same truncation defect on a larger corpus. |\n| `viafera` issue JSON corpus | 1,079,693 bytes | Evidence that Node's former 1 MiB child-process buffer was insufficient. |\n| Sweep commits excluded from issue attribution | 1% to 3% | Commits over the file threshold are named and counted but linked to no node. |\n| Sweep-size p99 across measured repositories | 64 to 101 files | Supports treating broad sweeps as non-attributable changes. |\n| Control Room routes | 2 + 5N | The composition contract: the briefing and the options view, plus five views per programme. Eight flat tabs were the ADR-0004 shape, replaced by ADR-0005 and re-nested by ADR-0007. |\n| Control Room locale keys | 179 | At en/it parity, and every one read by the template — both halves asserted by `npm test`. |\n| Control Room charts | 13 | Each chart has a table twin carrying the same numbers. |\n| Generated Control Room artifact size | 975,986 bytes for three programmes | Measured on the generated portfolio briefing (haben, arbiter, viafera), architecture viewer embedded once. |\n\n## Known defects, each with its evidence\n\n| Defect | Evidence | Consequence |\n|---|---|---|\n| The `docmap-cap` check asserted against a repository outside this one. | It read a feature matrix from a sibling checkout of the demo's source repository, silently skipping when absent — so it was green by absence on every CI run and red on one machine. Its expectation had also gone stale: the rows it pinned are now declared not-done upstream, making `planned` the correct answer and the assertion the wrong party. | Resolved: the block is removed. The property it guarded (#43, the prose cap must not silence the verdict) is asserted on the committed `docmap` fixture, where `statusFor` runs the identical path — see the #43 comment at [`test/run.mjs:1199-1210`](../test/run.mjs#L1199-L1210). |\n| The engine had no single place stating its rules. | Invariants were scattered across code comments, `CONTRIBUTING.md` and two scope documents; a since-deleted orientation document had drifted (it claimed the viewer was 746 lines when it is 1068, and that the model was never schema-validated when [`lib/check.mjs:28`](../lib/check.mjs) validates it). | Resolved on this branch: `ORIENTATION.md` is removed and replaced by [`GLOBAL_INVARIANTS.md`](GLOBAL_INVARIANTS.md), which pairs every rule with its enforcement point. |\n| The documented shipped-file count is stale and unenforced. | `AGENTS.md` required 20 files and said the `prepack` guard held that; `npm pack --dry-run --json` reports 36 (30 before this branch added the room modules, the RTM derivation and the locale tables), and [`scripts/check-clean.mjs:7-10`](../scripts/check-clean.mjs#L7-L10) checks residue only. | Still open. The false enforcement claim is removed from `AGENTS.md` and the real number stated, so the gap is visible rather than asserted away — but nothing yet fails when the selection changes. Bump deliberately or enforce the intended list mechanically. |\n"},{"path":"docs/FEASIBILITY.md","title":"Feasibility","lines":114,"bytes":5582,"text":"# Feasibility\n\nWhat is measured, what is estimated, and what is unknown. The three are kept apart on purpose: a\nplan that mixes them reads as confident everywhere and is trustworthy nowhere.\n\nEvery number below is either sourced or explicitly marked as not measured. If you add one, say\nwhich it is.\n\n---\n\n## 1. Measured\n\nTaken from real runs against real repositories on 2026-08-09 and 2026-08-10. Three private Go,\nTypeScript and Java/TypeScript repositories, plus Forma itself.\n\n### The issue corpus\n\n| Programme | Issues | Open | Waiting on a human | Milestones |\n|---|---:|---:|---:|---:|\n| haben | 466 | 6 | 4 | 7 |\n| arbiter | 1429 | 16 | 7 | 11 |\n| viafera | 2246 | 31 | 0 | 9 |\n| **total** | **4141** | **53** | **11** | |\n\nThe decidable surface is 53 items out of 4141, and 11 of those need a person. That ratio is the\nreason the Control Room is a briefing and not a wall of gauges.\n\n### The issue-to-code link, from git\n\n| Programme | Coverage | Note |\n|---|---:|---|\n| haben | 69% raw, 52% against the curated model | the model is 521 commits behind head |\n| arbiter | 54% | no curated model |\n| viafera | 56% | no curated model |\n\nNoise, measured rather than guessed: median 2 to 4 files per commit; p99 64 to 101; only 1 to 3\npercent of commits exceed 50 files. On haben, 16 commit sweeps were excluded and named.\n\n### Label vocabularies\n\n`priority` and `size` recur in all three repositories. Each also grows its own families: arbiter\nadds `tier`, `wave`, `release`, `audit`; viafera adds `type`, `domain`, `status`, `invariant`,\n`risk`. viafera's `priority` family contains `p2`, `P2` and `high` at once. This is why detection\nis automatic with a declared-override, and why nothing in `lib/` hardcodes a label.\n\n### The document corpus\n\n| Programme | Tracked Markdown | Bytes |\n|---|---:|---:|\n| haben | 370 | 3.9 MB |\n| arbiter | 569 | 3.7 MB |\n| viafera | 229 | 3.3 MB |\n| **total** | **1168** | **11.1 MB** |\n\nA naive walk of haben finds 8899 files and 70 MB, because 8544 of them are agent working copies\nunder `.claude/worktrees`. Any document feature must select from git-tracked files and carry an\nexplicit budget.\n\nOn haben, three documents carry almost the whole model: its feature matrix supports 27 nodes\nthrough `verify.source` and describes 25 through `descSource: docmap`; its product-boundary document\ncarries the timeline; `docs/architecture/ARCHITECTURE.md` is the governed document path.\n\n### The artifact\n\nThe generated portfolio briefing is 975,986 bytes across three programmes, with the architecture\nviewer embedded once. It contains 13 charts, each with a table twin, and 80 keyboard-reachable\nmarks. Both themes render; the console is clean apart from a favicon request.\n\n### Environment\n\nCodex's local sandbox does not start on this machine: `bwrap: loopback: Failed RTM_NEWADDR`,\nreproduced by invoking `bwrap` directly, caused by\n`kernel.apparmor_restrict_unprivileged_userns = 1`.\n\n## 2. Estimated\n\nMarked as estimates. None of these has been executed end to end.\n\n| Work | Estimate | Basis |\n|---|---|---|\n| curating an architecture model for one uncovered repository | 30 to 60 minutes of human judgement per repository | measured once on haben: 89 seconds of scripted editing plus the thinking, which dominates |\n| the document browser with a citation graph | not estimated in hours; bounded by the 11.1 MB corpus figure above, which forces an index-always, text-within-budget design | derived from the corpus measurement, not from an implementation |\n| a second repository proving the manifest is parametric | one manifest edit plus one curation, so it inherits the row above | the manifest mechanism exists and is exercised by three programmes, two of them without a model |\n\n## 3. Unknown\n\nStated rather than guessed. These are the questions that would change the plan if answered.\n\n- **Whether the briefing survives contact with a reader who is not its author.** Every judgement in\n  this repository about whether the artifact is useful has been made by the two people who built\n  it. That is the same stage-3 gap `docs/SCOPE.md` named for the viewer, in a new place.\n- **Whether the git link stays useful at low coverage.** At 52 to 69 percent it is informative. It\n  is not known where it stops being worth showing, or whether a repository with a different commit\n  convention drops below that.\n- **Whether the audit channel scales past a handful of issues.** Five verdicts were written by hand\n  against haben's open issues. Nothing has exercised it at fifty.\n- **Whether the artifact is readable at its full size on a modest machine.** It opens fine here at\n  roughly 1 MB with three programmes. Ten programmes with an inlined document corpus is a different\n  file and has not been built.\n- **The publishing question.** A single artifact concentrating issue titles, labels and\n  architecture for several private repositories is more sensitive than the parts. Whether it is\n  ever published is an owner decision that has not been taken.\n\n## 4. What would make this infeasible\n\nNamed so the answer is not improvised later.\n\n- A repository whose commits do not cite issue numbers: the link layer degrades to zero coverage\n  and the architecture view carries the whole product.\n- A programme whose \"waiting on a human\" concept has no label at all and no equivalent: the\n  briefing's first section has nothing to rank, and honestly reports an undeclared rule.\n- A hard requirement to publish a live, always-fresh board. Forma's determinism comes from\n  snapshots; a live board is a different product with a different honesty story.\n"},{"path":"docs/GOVERNANCE.md","title":"Governance","lines":93,"bytes":5108,"text":"# Governance\n\nHow a decision is made in this repository, where it is written down, and what stops it from being\nquietly reversed.\n\n## Who decides\n\nOne maintainer, Luca Dominici, named in [`CODEOWNERS`](../.github/CODEOWNERS). Every file has that\nowner; there is no area with ambiguous ownership, and pretending otherwise would be governance\ntheatre for a repository with one committer.\n\nThat is a fact about who *writes* Forma. It is deliberately not the standard Forma is graded\nagainst: `forma-arch` is published to npm and installed by strangers, so its documentation is\nmeasured on the enterprise column of the doc-set standard. The reasoning is recorded in\n[`standards/doc-profile`](../standards/doc-profile).\n\n## Where a decision lives\n\nFour registers, deliberately not merged, because they answer different questions.\n\n| Register | Question it answers | Lifecycle |\n|---|---|---|\n| [ADRs](adr/) | Why is the architecture shaped this way, and what was rejected | Immutable once Accepted; superseded by a new ADR that links back |\n| [`GLOBAL_INVARIANTS.md`](GLOBAL_INVARIANTS.md) | What must never break, and which file enforces it | Amended only with its enforcement point |\n| [`DECISION_REGISTRY.md`](../DECISION_REGISTRY.md) | Operational decisions that are not architecture | Rows carry an `Enforcement:` line; a matured row becomes an invariant or an ADR |\n| [`SCOPE.md`](SCOPE.md) / [`SCOPE-room.md`](SCOPE-room.md) | What \"finished\" means for a round of work | Closed when the round closes; a new confine needs a new document |\n\nThe rule that keeps these honest is the one Forma applies to itself: **a rule with no enforcement\nis a preference.** `GLOBAL_INVARIANTS.md` says so in its own closing section, and every row in it\nnames the file that turns red.\n\n## How a change lands\n\n1. Branch from `main`. Never commit to `main` directly.\n2. Make the change, with the check that would fail if it broke. For non-trivial logic that is a\n   block in `test/run.mjs`; for a claim about the model it is an assertion in `forma check`.\n3. Run the gate locally: `npm run lint`, `npm test`, `node bin/forma.mjs check`.\n4. Open a PR. CI runs the same gate on Node 18/20/22, plus the documentation gates.\n5. Squash-merge. One logical change, one commit.\n\nThe PR template asks for the blast radius and for the four boxes; those are the questions that have\nactually caught things.\n\n## What blocks a merge\n\nEverything in `ci-required`. It is a fail-closed aggregate job so that branch protection has a\nsingle context to require, and so a newly added check cannot be forgotten in the branch-protection\nsettings.\n\n| Gate | What it refuses |\n|---|---|\n| `npm run lint` | a shipped file that does not parse |\n| `npm test` | a fixture regression, and every Control Room and traceability assertion |\n| `node bin/forma.mjs check` | the committed model disagreeing with the code, the documents, or a generated artifact |\n| the documentation gates | a missing canonical document, missing or malformed frontmatter, a stale review date, a dead link, a dead path citation |\n\n## Amending an invariant\n\nAn invariant is not amended by editing prose. Write the check first, watch it fail on purpose, then\nwrite the row — the procedure is stated at the end of `GLOBAL_INVARIANTS.md`. Removing one requires\nsaying what now prevents the failure it was there to prevent.\n\n## Superseding an ADR\n\nADRs are immutable once Accepted. To change a decision, write a new ADR that links back and states\nwhat changed and why the earlier reasoning no longer holds. ADR-0005 superseding the tab layout and\nADR-0007 re-nesting it are the worked example: the record shows the shape was built, measured and\nrejected, which is information the current layout alone does not carry.\n\n## Documentation governance\n\nThe canonical document set, the tier it is graded on, and the overlays that apply are declared in\n[`standards/gold-doc-set.yml`](../standards/gold-doc-set.yml) and\n[`standards/doc-profile`](../standards/doc-profile). The engines that grade them live in `arbiter`\nand run in CI; the commands are in [`CONTRIBUTING.md`](../CONTRIBUTING.md).\n\nTwo conventions follow from that standard and apply to every hand-authored document here:\n\n- **Frontmatter is mandatory** — eight keys, with `last_review` as an ISO date and `doc_version` as\n  semver. `doc_version` is per-document content versioning and is independent of the product\n  version; the split is explained in [`SEMVER.md`](SEMVER.md).\n- **`tags` is a closed vocabulary.** Adding a tag that the standard does not define is a violation:\n  extend the taxonomy first.\n\n## The AI question\n\nForma is built with AI assistance, and [`AGENTS.md`](../AGENTS.md) is the contract an agent works\nunder. The governance position is one sentence: **no model's output is trusted, only its work is\nreviewed.** Every claim an agent adds must arrive with the check that falsifies it, which is the\nsame bar a human contribution meets. `gen --enrich` is the one place a model writes into an\nartifact, it is opt-in behind an explicit flag, it fills prose holes only, and nothing it produces\nreaches a gate.\n"},{"path":"docs/GLOSSARY.md","title":"Glossary","lines":114,"bytes":6135,"text":"# Glossary\n\nThe words Forma uses in a particular way. Where a term is ordinary English with a narrow technical\nmeaning here, the narrow meaning is the one that governs.\n\n## The model\n\n**Model** — `docs/architecture/c4-model.json`. The single source of truth, generated by `forma gen`\nand validated against `lib/schema/c4-model.schema.json`. Every rendering is a projection of it.\n\n**Topology** — `docs/architecture/c4-topology.json`. The curated input: which boxes exist, what\nthey are called, which directories they own. Seeded by `forma init`, then edited by a human.\n\n**Container** — a C4 building block. For Go it is the *package* (any directory holding a non-test\n`.go` file, however deep). For every other stack it is the shallowest directory holding source\ndirectly.\n\n**Component** — a synthesized layer, never curated: files in a flat container sharing a `foo_*`\nprefix are grouped when the container has enough leaves and the group enough members.\n\n**Leaf** — one source file. Except on Go, where files are counted but not drawn (`evidenceOnly`).\n\n**Edge** — a relationship. Curated, read from Go `import` blocks, or inferred from whole-word\nmatches of another container's exported names. An inferred edge says so (`estatus: \"inferred\"`).\n\n**Evidence** — a resolvable reference attached to a node: a `path` that must exist, a `glob` with a\ncount, a `doc`. Evidence that does not resolve fails `forma check`.\n\n**Overlay** — a file that decorates the model without widening its schema: `c4-status.json`\n(curated programme state), `c4-issues.json` (the issue fact base), `c4-health.json` (audit\nverdicts), `c4-findings.json` (the audit register). Each has its own lifecycle and its own writer.\n\n**Timeline** — a governed *future* architecture: an ordered list of checkpoints, each a typed\ncumulative patch over the AS-IS baseline. Not a schedule; it has no dates of its own.\n\n**Checkpoint** — one entry in the timeline. In the Control Room it carries a *measured* completion:\nthe closure rate of the issues that landed on the nodes it patches.\n\n## Four things that read as \"status\"\n\nThey are different axes and are never blended.\n\n| Axis | Values | Answers |\n|---|---|---|\n| `node.status` | `current`, `partial`, `planned`, `deprecated`, `unknown` | does this thing structurally exist |\n| `node.status2` | `done`, `in-progress`, `next`, `planned`, `problem`, `unknown` | programme state — this is what drives the colour |\n| `edge.estatus` | `active`, `to-build`, `inferred` | how much to trust this arrow |\n| health `verdict` | `ok`, `warn`, `bad` | an audited judgement on one issue |\n\n## The Control Room\n\n**Programme** — one repository participating in a briefing. Named in the manifest with a stable\n`id`, its checkout, its issue snapshot, and optionally a model.\n\n**Manifest** — `forma.room.json`. The one file another portfolio changes. Carries `today`, the\ndeterminism anchor.\n\n**Determinism anchor** — `manifest.today`. Nothing in the derivation path calls `Date.now()`, so\ntwo runs on unchanged inputs are byte-identical.\n\n**Briefing** — the artifact `forma room` composes: one self-contained HTML over N programmes.\n\n**Sweep** — a commit touching more files than `linkMaxFiles`. It attributes to no node, but is\ncounted and named rather than dropped.\n\n**Fact base** — `c4-issues.json`: a timestamped, offline-replayable snapshot of a repository's\nissues and milestones. Written only by `forma verify`, never hand-edited.\n\n**Taxonomy / family / axis** — a *family* is a set of labels sharing a `name\u003csep>value` shape\n(`priority:p1`). It becomes an *axis* once enough issues carry it. Pure pattern matching: Forma\ndoes not know that `p2` and `P2` mean the same thing unless the manifest says so.\n\n**Blocking rule** — what \"waiting on a human\" means for one programme, declared per programme and\nnever inferred. Three measured repositories used three different conventions and one used none.\n\n**Coverage** — used for two distinct measurements, always qualified: *issue-to-code coverage* (the\nshare of issues git can link to a node) and *document reach* (how much of a node a capability table\nactually names).\n\n## Traceability\n\n**RTM** — requirements traceability matrix. Here it is a *derivation* over tables the repository\nalready writes, never a curated file. See [ADR-0006](adr/0006-traceability-as-a-derivation-not-an-overlay.md).\n\n**Requirement, design, verification** — the roles a matrix row can play, declared per document in\nthe manifest. Forma does not infer which is which.\n\n**Orphan** — a hole in the matrix, in either direction: a requirement that lands on no work, or open\nwork no requirement claims. Both fail the gate; either alone would be half an answer.\n\n**WBS** — work breakdown structure. Here: the GitHub issues, made complete by the two orphan checks\nrather than asserted to be complete.\n\n**GAMP 5 / V-model** — the shape the chain borrows (URS → FS → DS on the left, PQ → OQ → IQ on the\nright, joined by a traceability matrix). Forma is **not** a validated system and makes no\ncompliance claim; the V-model is used here as a structure that already solved \"which document\nanswers which question\". A regulated context would additionally need the `gxp` overlay's documents.\n\n## Verification vocabulary\n\n**Gate** — a command that fails. `forma check` (adherence to code), `scripts/presentable.mjs` (is\nthe viewer worth projecting), `scripts/room-presentable.mjs` (does the briefing keep its promises).\n\n**Drift** — any disagreement between a committed artifact and a fresh re-derivation from raw inputs.\n\n**Declaration vs measurement** — a document saying \"done\" is a declaration; a count over facts that\ncould have come out differently is a measurement. Forma may show a declaration, labelled as one,\nand refuses to render it as a percentage.\n\n**Unknown** — a real value, rendered as a blank. Distinct from zero, which claims \"measured, none\".\n\n**False green** — a check that passes because it is not actually running, or because it grades a\nweaker property than the one it names. Most of Forma's gate design exists to prevent this.\n"},{"path":"docs/technical-debt.md","title":"Technical debt register","lines":30,"bytes":5482,"text":"# Technical debt register\n\nKnown shortcuts, what each one costs, and what would pay it back. A shortcut is listed here only\nwhen it is *deliberate* and has a stated ceiling; an unknown defect belongs in\n[`DELIVERY.md`](DELIVERY.md)'s defects table instead, and a thing simply not built belongs in\n[`SCOPE.md`](SCOPE.md).\n\nTwo conventions carried from the code: a deliberate simplification in `lib/` is marked with a\n`ponytail:` comment naming its ceiling and upgrade path, and nothing here is owed a fix until its\ntrigger fires. A debt with no trigger is a design decision, not debt.\n\n| # | Debt | Cost today | Trigger to pay it | Payback |\n|---|---|---|---|---|\n| D-1 | **Shipped-file count is documented, not enforced.** `AGENTS.md` states the `npm pack` selection size; `scripts/check-clean.mjs` only checks for editor residue. | The number has silently moved three times on one branch (30 → 31 → 36). A file could enter or leave the package unnoticed. | Any release where the selection changed without a deliberate note. | Either enforce the intended list mechanically in `check-clean.mjs`, or drop the number from prose and let `npm pack --dry-run` be the only statement. Deciding *which* is the open part. |\n| D-2 | **`docmap.mjs` matches a dead code ref by prefix.** `alive()` accepts a truncated ref so glob stems like `internal/imports/statement*.go` keep resolving. | A genuinely renamed path can read as alive if it shares a prefix with a surviving sibling, so a row keeps counting when it should have failed. | A false-alive measured on a real repository. | Keep the raw cell and relax the prefix rule only for refs that actually carried a `*`. The `ponytail:` comment at `lib/docmap.mjs` records this. |\n| D-3 | **Every Control Room view is in the DOM at load.** Views are built eagerly and hidden so printing can un-hide them all. | Cost grows with programmes × views, and the architecture iframes dominate it. Measured small on the fixture; unmeasured at portfolio scale. | The page is measurably slow on a real portfolio. | Lazy-mount the `map` view only — and pay for it by making print force a mount first, or the whole-briefing print guarantee breaks. Recorded as a consequence in [ADR-0007](adr/0007-views-nested-under-the-briefing.md). |\n| D-4 | **The RTM `issues` column is maintained by hand.** A design row names the issues that implement it. | It cannot rot silently — `forma check` fails on a dangling or missing reference — but it can tire, and tiring is how a discipline gets abandoned. | The column stops being updated in practice, i.e. the gate starts being worked around rather than satisfied. | `forma rtm --plan`, emitting rows for untraced open work in the same plan-then-apply shape `enrich` and `audit` already use. Named as a consequence in [ADR-0006](adr/0006-traceability-as-a-derivation-not-an-overlay.md). |\n| D-5 | **`coverageOf` reports 0% for an empty population.** `linked/total` with `total === 0` yields `0`, not `null`. | A repository with no issues at all reads \"0% linked\", which claims a measurement over an empty set — the exact shape I6 forbids elsewhere. | Any programme legitimately reaching the briefing with zero issues. | One line in `lib/link.mjs`, plus updating whatever compares the value. Left alone so far because it is pre-existing and no measured programme hits it. |\n| D-6 | **The demo model cannot regenerate itself.** `docs/demo/c4-model.json` is a snapshot committed from a local run against a private repository. | Nothing automated notices if it goes stale; the README says so out loud. | The demo misrepresents `haben` badly enough to mislead. | Either make the source repository reachable from CI, or replace the demo target with a public one. Both are real work, not a code change. |\n| D-7 | **The document gates run from a second repository.** Forma carries `standards/`, but the engines live in `arbiter` and CI checks it out. | The doc gate depends on another repository's default branch: a change there can turn this one red without a commit here. | The coupling causes a red that is not about forma. | Pin the arbiter checkout to a tag rather than a branch. Cheap, and deliberately deferred until the standard settles. |\n| D-8 | **The layout floor is measured, not gated.** D10 states that no route may overflow at 3440×1440 or 1920×900, and every claim in it comes from Playwright against the built artifact — run by hand, not by a job. The colour rule next to it *is* a gate. | A layout regression can merge. The one that made a half-height ultrawide release into a single 3381px column merged and was caught by a re-audit, not by CI. | Any second layout regression reaching `main`. | A browser step in the `docs` job, which already checks out a second repository, so Playwright there is a decision rather than a dependency smuggled into `package.json`. Deliberately **not** a CSS-text regex in `npm test`: a pattern that cannot fail for the right reason is worse than a written manual step. |\n\n## What is *not* debt\n\n- **Zero runtime dependencies.** A constraint, not a shortcut ([ADR-0001](adr/0001-zero-dependency-esm.md)).\n- **The hand-rolled JSON Schema walker.** It supports the subset the schemas use and refuses to\n  pretend otherwise; the alternative is a dependency, which is forbidden.\n- **Partial issue-to-code coverage.** Partial by construction — git only knows what a commit cited.\n  It is reported as a measurement with its denominator, never rounded up to a claim.\n"}],"listed":[{"path":"docs/INDEX.md","lines":43,"why":""},{"path":"docs/README.md","lines":71,"why":""},{"path":"docs/SCOPE-room.md","lines":137,"why":""},{"path":"docs/SCOPE.md","lines":230,"why":""},{"path":"docs/SEMVER.md","lines":65,"why":""},{"path":"docs/adr/0001-zero-dependency-esm.md","lines":27,"why":""},{"path":"docs/adr/0002-single-source-of-truth-model.md","lines":27,"why":""},{"path":"docs/adr/0003-npm-oidc-trusted-publishing.md","lines":28,"why":""},{"path":"docs/adr/0004-control-room-as-a-forma-rendering.md","lines":45,"why":""},{"path":"docs/adr/0005-portfolio-briefing-over-per-repo-dashboard.md","lines":52,"why":""},{"path":"docs/adr/0006-traceability-as-a-derivation-not-an-overlay.md","lines":70,"why":""},{"path":"docs/adr/0007-views-nested-under-the-briefing.md","lines":67,"why":""},{"path":"docs/adr/README.md","lines":25,"why":""}],"bytes":64074,"maxBytes":120000}}]};</script>

/* A restrained markdown renderer. The reader was handing a client the source: literal `#`, `**`
   and `|---|---|` rows. This covers what the canon actually uses — headings, bold, inline code,
   links, list items, pipe tables, block quotes — and falls back to the literal line for anything
   else rather than guessing. Every node is built with textContent, never innerHTML: repository
   prose is attacker-adjacent input and never becomes markup (I14). */
function inline(target,text){
 var re=/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g,last=0,m;
 while((m=re.exec(text))!==null){
  if(m.index>last)target.appendChild(document.createTextNode(text.slice(last,m.index)));
  var tok=m[0];
  if(tok.charAt(0)==="*")target.appendChild(el("strong","",tok.slice(2,-2)));
  else if(tok.charAt(0)==="`")target.appendChild(el("code","md-code",tok.slice(1,-1)));
  else{
   // A link target read out of repository prose is attacker-adjacent input (I14), and assigning it
   // to .href unchecked makes `[read me](javascript:...)` a live XSS in a document somebody else
   // wrote. Allow-list the schemes a document legitimately uses; anything else stays TEXT, visibly,
   // rather than being silently dropped — a link that will not be followed should say so.
   var cut=tok.indexOf("]("),label=tok.slice(1,cut),href=tok.slice(cut+2,-1);
   // `//host/x` is a network-path reference: same scheme, DIFFERENT HOST. It is not a relative
   // path, and the earlier pattern let it through because a leading `/` satisfied `\.{0,2}\/`.
   var relative=/^(#|\/(?!\/)|\.{1,2}\/)/.test(href),absolute=/^(https?:\/\/|mailto:)/i.test(href);
   if(relative||absolute){
    var a=el("a","",label);a.href=href;a.target="_blank";a.rel="noopener noreferrer";target.appendChild(a);
   }else target.appendChild(document.createTextNode(label+" ("+href+")"));
  }
  last=re.lastIndex;
 }
 if(last<text.length)target.appendChild(document.createTextNode(text.slice(last)));
 return target;
}
/* Levels are demoted by two. A rendered document sits inside a panel whose heading is an <h2>, so
   its own `#` is an h3: emitting <h1> would put a second top-level heading on a page that already
   has one, and a screen reader's heading list would read as two documents. */
function mdHeading(level){return "h"+Math.min(level+2,6);}
function renderMarkdown(src){
 var out=el("div","md"),lines=String(src).replace(/\r\n/g,"\n").split("\n"),i=0,para=[];
 function flush(){
  if(!para.length)return;
  inline(out.appendChild(el("p","")),para.join(" "));
  para=[];
 }
 /* Consecutive item lines become ONE list element. Emitting a <div> per item looked identical and
    exposed nothing: assistive technology got ten paragraphs where the document had a list of ten,
    with no "list, 10 items" and no way to skip it. */
 function list(tag,cls,first){
  var box=el(tag,cls),re=tag==="ol"?/^\s*(\d{1,3})\.\s+(.*)$/:/^\s*[-*]\s+(.*)$/,m;
  if(tag==="ol"&&first!==1)box.setAttribute("start",String(first));
  while(i<lines.length&&(m=re.exec(lines[i]))!==null){
   inline(box.appendChild(el("li","md-li","")),m[tag==="ol"?2:1]);i++;
  }
  out.appendChild(box);
 }
 while(i<lines.length){
  var ln=lines[i],h=/^(#{1,6})\s+(.*)$/.exec(ln);
  if(/^\s*$/.test(ln)){flush();i++;continue;}
  if(h){flush();inline(out.appendChild(el(mdHeading(h[1].length),"md-h md-h"+h[1].length,"")),h[2]);i++;continue;}
  if(/^```/.test(ln)){
   flush();var buf=[];i++;
   while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);
   i++;out.appendChild(el("pre","md-pre",buf.join("\n")));continue;
  }
  if(/^\s*\|.*\|\s*$/.test(ln)){
   flush();
   var rows=[];
   while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){
    var cells=lines[i].trim().slice(1,-1).split("|").map(function(c){return c.trim();});
    if(!/^[\s:|-]+$/.test(lines[i].trim().replace(/^\||\|$/g,"")))rows.push(cells);
    i++;
   }
   if(rows.length){
    var t=el("table","md-table"),th=el("thead"),htr=el("tr"),tb=el("tbody"),c;
    for(c=0;c<rows[0].length;c++){var hc=el("th");hc.setAttribute("scope","col");inline(hc,rows[0][c]);htr.appendChild(hc);}
    th.appendChild(htr);t.appendChild(th);
    for(var r=1;r<rows.length;r++){var tr=el("tr");for(c=0;c<rows[r].length;c++)inline(tr.appendChild(el("td")),rows[r][c]);tb.appendChild(tr);}
    t.appendChild(tb);out.appendChild(t);
   }
   continue;
  }
  if(/^\s*[-*]\s+/.test(ln)){flush();list("ul","md-ul",1);continue;}
  /* `\d{1,3}\.` and not `\d+\.`: a paragraph opening "2026. The year the manifest was frozen"
     is prose, not the two-thousand-and-twenty-sixth item of a list. */
  var ol=/^\s*(\d{1,3})\.\s+/.exec(ln);
  if(ol){flush();list("ol","md-ol",parseInt(ol[1],10));continue;}
  var q=/^>\s?(.*)$/.exec(ln);
  if(q){
   flush();var qb=el("blockquote","md-q");
   while(i<lines.length&&(q=/^>\s?(.*)$/.exec(lines[i]))!==null){inline(qb.appendChild(el("p","")),q[1]);i++;}
   out.appendChild(qb);continue;
  }
  if(/^---+$/.test(ln)){flush();out.appendChild(el("hr","md-hr"));i++;continue;}
  para.push(ln.trim());i++;
 }
 flush();
 return out;
}
