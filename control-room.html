<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma</title>
<style>
/* Every value here was produced by `node scripts/palette.mjs`, which is the script docs/DESIGN.md
   D6 claimed had already been run and which did not exist until it was written. OKLCH because the
   thing being held constant is perceptual lightness: the status trio is separated by L on purpose,
   since lightness is the one channel that survives colour-blind vision, and in hex that separation
   is invisible to the person editing it.
   Do not hand-tune a value here. Change the target in the script, re-run it, and paste the result. */
:root{color-scheme:dark;
 --bg:oklch(17.1% 0.008 67);--surface:oklch(21.5% 0.009 75);--line:oklch(30.9% 0.010 61);
 --ink:oklch(93.0% 0.006 60);--muted:oklch(61.5% 0.012 63);
 --ok:oklch(74.6% 0.145 152);--warn:oklch(86.8% 0.126 80);--bad:oklch(64.7% 0.185 25);
 --accent:oklch(61.4% 0.130 250);--series2:oklch(52.5% 0.014 67);
 --ramp1:oklch(52.5% 0.070 250);--ramp2:oklch(56.0% 0.090 250);--ramp3:oklch(59.5% 0.110 250);--ramp4:oklch(63.0% 0.132 250)}
html[data-theme="light"]{color-scheme:light;
 --bg:oklch(97.4% 0.006 75);--surface:oklch(99.5% 0.005 78);--line:oklch(88.0% 0.010 82);
 --ink:oklch(22.0% 0.009 75);--muted:oklch(54.0% 0.013 72);
 --ok:oklch(52.9% 0.141 151);--warn:oklch(44.4% 0.094 73);--bad:oklch(35.5% 0.144 25);
 --accent:oklch(54.2% 0.169 255);--series2:oklch(63.3% 0.013 80);
 --ramp1:oklch(63.3% 0.079 255);--ramp2:oklch(59.2% 0.110 255);--ramp3:oklch(55.1% 0.145 255);--ramp4:oklch(51.0% 0.172 255)}

/* THE SHELL. This is a viewport-sized application, not a document: the page never scrolls, panels
   scroll inside themselves, and every view fits the screen it was opened on. The number that
   governs the layout is not 1080 — a real 1920x1080 monitor leaves ~900px of viewport once the tab
   strip, the address bar and the taskbar have taken their share, so ~815px of content is the floor
   every view is designed against. Below 1200px wide the shell lets go and the page scrolls again,
   which is the right answer for a phone and is stated rather than pretended away. */
*{box-sizing:border-box}
:root{--pad:16px;--gap:16px;--bar:52px}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;
 display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button,a,summary,select{font:inherit;color:inherit}
a{color:inherit;text-decoration-color:var(--muted);text-underline-offset:2px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
[hidden]{display:none!important}
.skip{position:fixed;left:8px;top:6px;z-index:40;padding:6px 10px;background:var(--surface);border:1px solid var(--accent);transform:translateY(-160%)}
.skip:focus{transform:none}

/* One bar. The previous shell spent 177px on a header plus two rows of navigation, which is 20% of
   the floor's usable height before a single number is shown. */
.bar{display:flex;align-items:center;gap:18px;height:var(--bar);padding:0 var(--pad);
 border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0;flex:0 1 auto}
.brand h1{margin:0;font-size:14px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-size:11px;font-family:"SF Mono",Menlo,Consolas,monospace}
.tabs{display:flex;gap:2px;align-items:center;flex:0 0 auto}
.tabs a{display:block;padding:5px 10px;color:var(--muted);font-size:12.5px;text-decoration:none;border-radius:5px}
.tabs a:hover{color:var(--ink);background:var(--surface)}
.tabs a[aria-current]{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--accent)}
.bar-sep{width:1px;height:20px;background:var(--line);flex:0 0 auto}
.bar-end{margin-left:auto;display:flex;gap:8px;align-items:center;flex:0 0 auto}
.ghost{appearance:none;border:1px solid var(--line);border-radius:999px;background:none;padding:4px 10px;font-size:12px;cursor:pointer}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

main{min-height:0;padding:var(--pad);overflow:hidden}
.view{display:grid;grid-template-rows:auto minmax(0,1fr);gap:var(--gap);height:100%;min-height:0}
.view[data-single]{grid-template-rows:minmax(0,1fr)}

/* A panel is a region, not a card: a top rule and a heading on the same ground. Boxing every
   region would add three borders and a shadow to say what one hairline already says, and nesting
   the issue rows inside those boxes would be a card inside a card. */
.panel{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);padding-top:8px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:0 0 auto}
.panel h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.01em}
/* THE SIGNATURE. No panel without its provenance: one line saying what was counted and what
   re-checks it. Every other dashboard asks to be believed; this one says how to check it. */
.prov{margin:1px 0 6px;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
.panel-body{min-height:0;overflow:auto;flex:1 1 auto;scrollbar-width:thin}
.panel-body>p{max-width:72ch}

.answer{display:grid;gap:var(--gap);grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.evidence{display:grid;gap:var(--gap);min-height:0;overflow:auto;scrollbar-width:thin;
 grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(230px,1fr)}
.span2{grid-column:span 2}
.full{grid-column:1/-1}
@media(min-width:1500px){
 .answer,.evidence{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:2300px){
 :root{--pad:22px;--gap:20px}
 .answer,.evidence{grid-template-columns:repeat(4,minmax(0,1fr))}
 body{font-size:15px}
 .evidence{grid-auto-rows:minmax(280px,1fr)}
}
/* Below the floor the shell is released rather than crushed: the page scrolls.
   Gated on HEIGHT as well as width, because the budget being protected is vertical: a 1920x640
   window is not a phone, and holding the locked shell there delivered the whole evidence tier
   through a 97px slot with no page scrollbar. 760px is the height at which 52px of bar, 32px of
   padding and two usable rows stop fitting. */
@media(max-width:1199px),(max-height:760px){
 body{height:auto;overflow:visible;display:block}
 main{overflow:visible;height:auto}
 .bar{position:sticky;top:0;z-index:20;background:var(--bg)}
 .view{height:auto;display:block}
 .answer,.evidence{overflow:visible;grid-auto-rows:auto}
 .panel{margin-bottom:var(--gap)}
 .panel-body{overflow:visible;max-height:none}
}
/* Only a NARROW release collapses to one column. Folding the column rule into the query above
   meant a wide, short window — an ultrawide snapped to half height — released into a single
   3381px column: `.answer` alone grew to 1535px and "Now" sat 1609px below the fold, for content
   that occupies 520px at full height. Releasing the height should let the page scroll, not throw
   away 2200px of width. */
@media(max-width:1199px){
 .answer,.evidence{grid-template-columns:1fr}
 .span2,.full{grid-column:auto}
}

/* Type. One thing on the page is large: the thesis. Everything else is 10.5-14px, because a
   briefing that fits a screen buys its density from restraint, not from shrinking the answer. */
.thesis{margin:0;font-size:clamp(19px,1.55vw,30px);line-height:1.15;letter-spacing:-.02em;font-weight:650;max-width:26ch}
.lede{margin:6px 0 0;color:var(--muted);font-size:12px;max-width:52ch}
.muted{color:var(--muted)}
.data{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11.5px}

/* KPI strip: one row of numbers, hairline-separated, no boxes. */
.kpis{display:flex;gap:0;flex-wrap:wrap}
.kpi{flex:1 1 130px;padding:2px 14px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi dt{margin:0 0 2px;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi dd{margin:0;font-size:clamp(20px,1.5vw,28px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi dd small{display:block;font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--muted);line-height:1.3;white-space:normal}

/* Rows. `details` stays: expanding evidence in place is the product's own reading model (D5). */
.rows>details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:7px 22px 7px 0;position:relative}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";position:absolute;right:4px;top:6px;color:var(--muted);font-family:"SF Mono",Menlo,Consolas,monospace}
details[open]>summary:after{content:"\2212"}
.row-head{display:grid;grid-template-columns:auto auto 1fr;align-items:baseline;gap:9px}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ref{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;color:var(--muted);white-space:nowrap}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.detail{padding:0 22px 10px 0;display:grid;grid-template-columns:minmax(96px,132px) 1fr;gap:4px 14px;font-size:12.5px}
.detail dt{color:var(--muted);font-size:11px}
.detail dd{margin:0;min-width:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;white-space:nowrap}
.glyph{width:12px;text-align:center;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:13px}
.status-ok{color:var(--ok)}.status-warn{color:var(--warn)}.status-bad{color:var(--bad)}.status-none{color:var(--muted)}
.tally{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:7px}
.group{padding:6px 0;border-top:1px solid var(--line)}
.group:first-child{border-top:0}
.group-name{display:block;margin-bottom:3px;color:var(--muted);font-size:10.5px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.kv{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:12px;font-size:12.5px}
.kv>span:first-child{color:var(--muted)}

/* Charts fill the box the grid gave them. The old viewBox had a fixed height and took its width
   from the aspect ratio, which is exactly why a grid row could never contain one. */
.chart{min-height:0}
.chart-viz{flex:1 1 auto;min-height:0;position:relative}
.chart-viz svg{display:block;width:100%;height:100%}
.axis{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.mark-accent{fill:var(--accent)}.mark-series2{fill:var(--series2)}.mark-bad{fill:var(--bad)}
.meter-track{fill:var(--accent);opacity:.18}.area-fill{fill:var(--accent);opacity:.16}
.area-line{fill:none;stroke:var(--accent);stroke-width:2}
.line-series2{fill:none;stroke:var(--series2);stroke-width:2;stroke-dasharray:4 3}
.svg-label{fill:var(--muted);font:10.5px "SF Mono",Menlo,Consolas,monospace}
.svg-value{fill:var(--ink);font:10.5px "SF Mono",Menlo,Consolas,monospace}
.hit{cursor:help;outline:none}
.hit:focus{stroke:var(--accent);stroke-width:2}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;flex:0 0 auto;padding-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:5px}
.tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:5px 8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:11.5px;line-height:1.3}
.toggle{appearance:none;border:1px solid var(--line);border-radius:999px;background:none;padding:2px 8px;font-size:10.5px;cursor:pointer;color:var(--muted);flex:0 0 auto}
.toggle:hover{border-color:var(--accent);color:var(--accent)}
.tablewrap{overflow:auto;min-height:0;flex:1 1 auto}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{text-align:left;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--bg)}
.nums{font-variant-numeric:tabular-nums}
.matrix .id{font-family:"SF Mono",Menlo,Consolas,monospace;white-space:nowrap}
.hole{padding:5px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px;font-size:12px}
.hole>span:first-child{color:var(--bad);font-size:11px}

/* The map finally gets the area an ultrawide actually has. */
.frame{width:100%;height:100%;min-height:0;display:block;border:1px solid var(--line);background:var(--surface)}
/* Two panes, not an accordion: a document is not a disclosure widget. */
.reader{margin:0;max-width:78ch;font-size:13px;line-height:1.6}
.md p{margin:0 0 10px;max-width:72ch}
.md-h{font-weight:650;letter-spacing:-.01em;margin:16px 0 6px}
.md-h1{font-size:17px;margin-top:0}.md-h2{font-size:15px}.md-h3{font-size:13.5px}
.md-h4,.md-h5,.md-h6{font-size:12.5px;color:var(--muted)}
/* Real ul/ol/li, so the marker is the browser's. The hand-drawn en dash that used to sit in a
   ::before is gone: keeping it would print twice, once from the pseudo-element and once from the
   list marker the element now has. */
.md-ul,.md-ol{margin:0 0 10px;padding-left:20px}
.md-ul{list-style:disc}.md-ol{list-style:decimal}
.md-li{margin:0 0 4px;max-width:70ch}
.md-li::marker{color:var(--muted)}
.md-q{margin:0 0 10px;padding-left:12px;border-left:2px solid var(--line);color:var(--muted);max-width:70ch}
.md-q>p:last-child{margin-bottom:0}
.md-pre{margin:0 0 10px;padding:8px 10px;background:var(--surface);overflow:auto;font:11.5px/1.5 "SF Mono",Menlo,Consolas,monospace}
.md-code{font:11.5px "SF Mono",Menlo,Consolas,monospace;color:var(--muted)}
.md-table{margin:0 0 12px;font-size:11.5px}
.md-hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.print-all{display:none}
.doclist button{display:block;width:100%;text-align:left;appearance:none;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 4px;cursor:pointer;font-size:12.5px}
.doclist button:hover{color:var(--accent)}
.doclist button[aria-current]{color:var(--ink);box-shadow:inset 2px 0 0 var(--accent);padding-left:9px}
.doclist small{display:block;color:var(--muted);font-size:10.5px;font-family:"SF Mono",Menlo,Consolas,monospace}
.opt{padding:7px 0;border-bottom:1px solid var(--line)}
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.flag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:10.5px;color:var(--muted)}
.flag.on{border-color:var(--accent);color:var(--accent)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Printing hands over the WHOLE briefing. A hash route is not something anyone can put on paper,
   so the shell is released, every view is un-hidden, and each starts a page. */
@media print{
 /* The print palette is DECLARED, not inherited. Setting only body{color:#000} left every token at
    its dark-theme value, so chart numbers printed at 1.23:1 against white — invisible — and every
    provenance line at 3.73:1. Worse, the theme persists to localStorage, so the paper output
    differed depending on what the reader last clicked. These are the measured light values.

    Declared is not the same as WINNING. A media query adds no specificity, so `:root` here scored
    (0,1,0) and `html[data-theme="light"]` scored (0,1,1) and outranked it: every reader who had
    ever pressed the theme button printed the light UI palette instead, --muted at 5.05:1 and the
    hairline at 1.43:1, on cream. The dark case only passed because it TIED the base :root and won
    on source order — the accident, not the rule. Doubling the pseudo-class scores (0,2,1), above
    any single-attribute theme selector, so this wins on specificity and not on where it sits.
    scripts/palette.mjs now compares the two and fails if a theme selector ever catches up. */
 html:root:root{
  --bg:oklch(100% 0 0);--surface:oklch(100% 0 0);--line:oklch(80% 0 0);
  --ink:oklch(22.0% 0.009 75);--muted:oklch(44.0% 0.010 72);
  --ok:oklch(52.9% 0.141 151);--warn:oklch(44.4% 0.094 73);--bad:oklch(35.5% 0.144 25);
  --accent:oklch(45.0% 0.150 255);--series2:oklch(55.0% 0.012 80);
  --ramp1:oklch(63.3% 0.079 255);--ramp2:oklch(59.2% 0.110 255);--ramp3:oklch(55.1% 0.145 255);--ramp4:oklch(51.0% 0.172 255)}
 /* `color-scheme:dark` is a UA instruction, not a token, and the print palette could not reach it:
    the canvas kept being painted #121212 under the white page, so a dark-theme reader's PDF opened
    on a black sheet. Every token matched and the paper still differed on all 29 sheets. The canvas
    is declared here for the same reason the colours are. */
 html:root:root{color-scheme:light;background:var(--bg)}
 body{height:auto;overflow:visible;display:block;background:var(--bg);color:var(--ink);font-size:10pt}
 .bar,.toggle,.tip,.skip,.ghost{display:none!important}
 main{overflow:visible;height:auto;padding:0}
 .view{height:auto;display:block}
 .view[hidden]{display:block!important}
 .view+.view{break-before:page}
 .answer,.evidence{display:block;overflow:visible}
 .panel{break-inside:avoid;border-top:1px solid #999;margin-bottom:10pt}
 .panel-body,.tablewrap{overflow:visible;max-height:none}
 .chart-viz{height:200pt}
 /* `details>*{display:revert}` does NOT defeat Chrome's disclosure hiding: a controlled A/B showed
    the body of a closed <details> simply absent from the PDF. Every per-issue evidence block —
    verdict, why, evidence refs, nodes, milestone, last landing — was silently dropped from the
    printed briefing, which is the one thing the print promise exists to carry. The rows are opened
    in beforeprint instead, and restored afterwards. */
 .frame{height:340pt}
 /* Each view identifies itself on paper. The bar is hidden when printing, so without this the
    output was eleven anonymous sheets with no product name, date, programme or view on any of them. */
  .print-all{display:block!important}
 .reader>.md{display:none}
 .doc-reader-head{display:none!important}
 .print-id{display:block!important;margin:0 0 8pt;padding-bottom:4pt;border-bottom:1pt solid var(--line);
  font:9pt "SF Mono",Menlo,Consolas,monospace;color:var(--muted)}
}
.print-id{display:none}
</style>
</head>
<body>
<button class="skip" id="skip" type="button"></button>
<header class="bar" id="bar">
 <div class="brand"><h1 id="page-title"></h1><span id="page-stamp"></span></div>
 <div class="bar-sep" aria-hidden="true"></div>
 <nav class="tabs" id="nav-programs"></nav>
 <div class="bar-sep" aria-hidden="true"></div>
 <nav class="tabs" id="nav-views"></nav>
 <div class="bar-end"><button class="ghost" id="theme-toggle" type="button"></button></div>
</header>
<main id="content" tabindex="-1"></main>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
