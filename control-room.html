 rp.head.className+=" doc-reader-head";
 rp.classList.add("span2");
 var body=el("div","reader"),title=rp.head.querySelector("h2"),link=el("span");
 rp.head.appendChild(link);
 rp.body.appendChild(body);
 // On screen the reader shows one document. On paper it must carry all of them: the panel is
 // headed "N documents embedded" and the PDF contained one, which is the heading lying.
 //
 // Built on demand, not at load. Rendering every canon document for every programme cost every
 // visitor the whole corpus whether or not they ever opened this view or ever pressed print, and it
 // scales with programmes x each one's byte budget.
 var all=el("div","print-all");
 all.fill=function(){
  if(all.firstChild)return;
  for(var a=0;a<docs.embedded.length;a++){
   // h2, matching the panel heading a document sits under on screen, so the demotion in
   // renderMarkdown lands its `#` at h3 in both places.
   all.appendChild(el("h2","md-h md-h1",docs.embedded[a].title||docs.embedded[a].path));
   all.appendChild(el("div","prov",docs.embedded[a].path));
   all.appendChild(renderMarkdown(docs.embedded[a].text));
  }
 };
 PRINT_FILL.push(all);
 rp.body.appendChild(all);
 function open(idx){
  var d=docs.embedded[idx],b;
  title.textContent=d.title||d.path;
  link.textContent="";link.appendChild(docLink(program,d.path,null,STR.docsOpen));
  body.textContent="";body.appendChild(renderMarkdown(d.text));
  rp.body.scrollTop=0;
  announce(d.title||d.path);
  var btns=listWrap.querySelectorAll("button");
  for(b=0;b<btns.length;b++){if(b===idx)btns[b].setAttribute("aria-current","true");else btns[b].removeAttribute("aria-current");}
 }
 for(i=0;i<docs.embedded.length;i++){
  (function(idx){
   var d=docs.embedded[idx],b=el("button");
   b.type="button";b.appendChild(document.createTextNode(d.title||d.path));
   b.appendChild(el("small","",d.path+" · "+fmt(STR.docsLines,{n:d.lines})));
   b.addEventListener("click",function(){open(idx);});
   listWrap.appendChild(b);
  })(i);
 }
 lp.body.appendChild(listWrap);
 if(docs.listed.length){
  var others=el("div","group");
  others.appendChild(el("span","group-name",STR.docsOther));
  for(i=0;i<docs.listed.length;i++){
   var row=el("div","kv"),l=docs.listed[i];
   row.appendChild(docLink(program,l.path));
   row.appendChild(el("span","",l.why==="budget"?STR.docsTooLarge:(l.lines==null?"":fmt(STR.docsLines,{n:l.lines}))));
   others.appendChild(row);
  }
  lp.body.appendChild(others);
 }
 ev.appendChild(lp);ev.appendChild(rp);
 view.appendChild(ev);
 if(docs.embedded.length)open(0);
}

function viewOptions(view){
 view.setAttribute("data-single","");
 var ev=el("div","evidence"),i,j;
 var ip=panel(STR.optIncluded,fmt(STR.provOptions,{file:ROOM.meta.generatedFrom}),"span2");
 for(i=0;i<ROOM.programs.length;i++){
  var p=ROOM.programs[i],row=el("div","opt"),head=el("div"),flags=el("div","flags");
  head.appendChild(el("strong","",p.id));head.appendChild(el("span","muted"," — "+p.ghRepo));
  if(SERVED)head.appendChild(toggle(p.id,true));
  row.appendChild(head);
  var has=[[STR.optHasMap,p.hasMap],[STR.optHasHealth,((p.health&&p.health.verdicts)||[]).length>0],
           [STR.optHasFindings,((p.findings&&p.findings.findings)||[]).length>0],
           [STR.optHasRtm,!!p.derived.rtm],[STR.optHasDocs,!!(p.docs&&p.docs.embedded.length)],
           [STR.optHasBlockedBy,sumOf(p.id).blockedRule.declared]];
  for(j=0;j<has.length;j++)flags.appendChild(el("span","flag"+(has[j][1]?" on":""),has[j][0]+": "+(has[j][1]?STR.optYes:STR.optNo)));
  row.appendChild(flags);ip.body.appendChild(row);
 }
 ev.appendChild(ip);

 var xp=panel(STR.optExcluded,STR.provExcluded),ex=ROOM.meta.excluded||[];
 if(!ex.length)xp.body.appendChild(el("p","muted",STR.optNoneExcluded));
 for(i=0;i<ex.length;i++){
  var r=el("div","kv"),why=el("span");
  r.appendChild(el("span","data",ex[i].id));
  why.appendChild(el("span","",STR.optReasonDisabled));
  if(SERVED)why.appendChild(toggle(ex[i].id,false));
  r.appendChild(why);xp.body.appendChild(r);
 }
 xp.body.appendChild(el("p","muted",fmt(STR.optHowToChange,{file:ROOM.meta.generatedFrom})));
 ev.appendChild(xp);
 view.appendChild(ev);
}

// A checkbox appears only when the COMPOSER said this copy has somewhere to write to — which is
// only true of the page `forma room --serve` hands out. Inferring it from location.protocol was
// wrong in the way that matters: it is true on any static host, so the public demo on Pages would
// have rendered live switches whose PUT lands on nothing. A dead switch teaches the reader the page
// lies, which is the one thing this briefing cannot afford.
var SERVED=window.__WRITABLE__===true;
function toggle(id,enabled){
 var wrap=el("label","flag"+(enabled?" on":"")),box=document.createElement("input"),err=el("span","muted");
 box.type="checkbox";box.checked=enabled;box.style.marginRight="5px";
 wrap.style.marginLeft="8px";
 wrap.appendChild(box);wrap.appendChild(document.createTextNode(enabled?STR.optYes:STR.optNo));
 box.addEventListener("change",function(){
  var b={};b[id]=box.checked;box.disabled=true;
  fetch("/programs",{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify(b)})
   .then(function(r){return r.ok?r.json():r.text().then(function(t){throw new Error(t);});})
   .then(function(){location.reload();})
   .catch(function(e){box.disabled=false;box.checked=!box.checked;err.textContent=" "+String(e.message||e);});
 });
 var span=el("span");span.appendChild(wrap);span.appendChild(err);return span;
}

/* --------------------------------- routing -------------------------------- */
var VIEWS={},ORDER=[],PRINT_FILL=[];
var TABS=[["exec",function(){return STR.routeExec;}],["tech",function(){return STR.routeTech;}],
          ["map",function(){return STR.routeMap;}],["wbs",function(){return STR.routeWbs;}],
          ["docs",function(){return STR.routeDocs;}]];
var BUILD={exec:viewExec,tech:viewTech,map:viewMap,wbs:viewWbs,docs:viewDocs};
function key(p,t){return p?"/"+p+"/"+t:"/"+t;}
function mount(k){
 var v=el("section","view");v.id="view-"+k.replace(/[^a-z0-9]+/gi,"-");v.hidden=true;
 v.appendChild(el("p","print-id",""));
 document.getElementById("content").appendChild(v);VIEWS[k]=v;ORDER.push(k);return v;
}
/* A running header, because `.print-id` is a block element and a block element stamps the page it
   starts on: seven identity lines covered seven of twenty-nine sheets, and the twenty in the
   Documents view came out anonymous. A `@page` margin box repeats on every sheet and is the only
   place `counter(page)` is legal, so it also carries the page number the briefing never had.
   Measured in Chrome 151 before being written, not recalled: 34 of 34 pages, numbers included. */
function stampRunningHead(){
 // ROOM.meta is repository text and this builds a CSS string, so the quote and the backslash are
 // escaped for the same reason I14 keeps that text out of markup. A newline is illegal inside a CSS
 // string, not merely ugly, and would silently drop the whole rule.
 var esc=function(s){return String(s==null?"":s).replace(/[\\"]/g,"\\$&").replace(/[\r\n\f]+/g," ");};
 var head=esc((ROOM.meta.title||STR.appTitle)+"  ·  "+ROOM.meta.today);
 var s=document.createElement("style");
 s.textContent="@page{margin:16mm 12mm 12mm;"+
  "@top-left{content:\""+head+"\";font:8pt \"SF Mono\",Menlo,Consolas,monospace;color:#56524d}"+
  "@top-right{content:counter(page) \" / \" counter(pages);font:8pt \"SF Mono\",Menlo,Consolas,monospace;color:#56524d}}";
 document.head.appendChild(s);
}
function stampPrintIds(){
 var k,p,name;
 for(k in VIEWS)if(VIEWS.hasOwnProperty(k)){
  p=progOf(k);
  name=k==="/"?STR.routePortfolio:k==="/options"?STR.routeOptions:tabLabel(k);
  VIEWS[k].querySelector(".print-id").textContent=
   (ROOM.meta.title||STR.appTitle)+"  ·  "+(p?p+"  ·  ":"")+name+"  ·  "+ROOM.meta.today;
 }
}
function buildAll(){
 var i,j;
 viewPortfolio(mount("/"));
 for(i=0;i<ROOM.programs.length;i++){
  var program=ROOM.programs[i],summary=sumOf(program.id);
  for(j=0;j<TABS.length;j++)BUILD[TABS[j][0]](mount(key(program.id,TABS[j][0])),program,summary);
 }
 viewOptions(mount("/options"));
}
// The pre-tab anchors stay valid addresses: #now was a link somebody could have sent.
var LEGACY={verdict:"/",now:"/",moving:"/",mismatch:"/",programs:"/",map:null};
function normalize(h){
 var raw=String(h||"").replace(/^#/,"");
 if(!raw)return "/";
 if(raw.charAt(0)==="/")return VIEWS[raw]?raw:"/";
 if(LEGACY.hasOwnProperty(raw)){
  if(LEGACY[raw])return LEGACY[raw];
  var f=ROOM.programs[0];return f?key(f.id,raw==="map"?"map":"exec"):"/";
 }
 return "/";
}
function progOf(k){var m=/^\/([^/]+)\/([^/]+)$/.exec(k);return m?m[1]:null;}
function navLink(href,text){var a=el("a","",text);a.href="#"+href;return a;}
// Built once. Rebuilding it on every route change destroyed the anchor the user had just pressed
// and left focus on <body>, so each navigation forced a Tab-from-the-top.
function buildNav(){
 var progs=document.getElementById("nav-programs"),views=document.getElementById("nav-views"),i,j;
 progs.appendChild(navLink("/",STR.routePortfolio));
 for(i=0;i<ROOM.programs.length;i++)progs.appendChild(navLink(key(ROOM.programs[i].id,"exec"),ROOM.programs[i].id));
 progs.appendChild(navLink("/options",STR.routeOptions));
 // One set of view tabs, re-pointed at whichever programme is open. They are present from the
 // first screen rather than appearing only after the reader guesses that a lowercase repo id
 // between two sentence-case labels is the primary action.
 for(i=0;i<TABS.length;i++){
  var a=navLink("/",TABS[i][1]());
  a.setAttribute("data-tab",TABS[i][0]);
  views.appendChild(a);
 }
}
function renderNav(k){
 var progs=document.getElementById("nav-programs"),views=document.getElementById("nav-views"),i;
 var p=progOf(k)||(ROOM.programs[0]&&ROOM.programs[0].id);
 var links=progs.querySelectorAll("a");
 for(i=0;i<links.length;i++){
  var href=links[i].getAttribute("href").slice(1);
  // "true", not "page". Two landmarks both marking their selection as aria-current="page" made a
  // screen reader announce "current page" twice on one screen; only ONE of them is the page. The
  // programme is the current item within its list, which is what the plain token means.
  if(href===k||(progOf(k)&&href===key(progOf(k),"exec")))links[i].setAttribute("aria-current","true");
  else links[i].removeAttribute("aria-current");
 }
 var tabs=views.querySelectorAll("a");
 for(i=0;i<tabs.length;i++){
  var t=tabs[i].getAttribute("data-tab"),target=p?key(p,t):"/";
  tabs[i].href="#"+target;
  if(k===target)tabs[i].setAttribute("aria-current","page");else tabs[i].removeAttribute("aria-current");
 }
}
function show(k){
 var x;
 for(x in VIEWS)if(VIEWS.hasOwnProperty(x))VIEWS[x].hidden=x!==k;
 renderNav(k);
 var p=progOf(k);
 var name=(k==="/"?STR.routePortfolio:k==="/options"?STR.routeOptions:tabLabel(k));
 document.title=(ROOM.meta.title||STR.appTitle)+(p?" · "+p:"")+" · "+name;
 announce(p?p+" · "+name:name);
 relayoutAll(VIEWS[k]);
}
function tabLabel(k){
 var m=/^\/[^/]+\/([^/]+)$/.exec(k),i;
 if(m)for(i=0;i<TABS.length;i++)if(TABS[i][0]===m[1])return TABS[i][1]();
 return k;
}
function announce(text){var l=document.getElementById("live");if(l)l.textContent=text;}
function onHash(){show(normalize(location.hash));}

function applyTheme(){
 var saved=null,t;
 try{saved=localStorage.getItem("forma-room-theme");}catch(e){}
 t=saved==="light"||saved==="dark"?saved:(ROOM&&ROOM.meta&&ROOM.meta.theme==="light"?"light":"dark");
 document.documentElement.setAttribute("data-theme",t);themeButton(t);
}
function themeButton(t){var b=document.getElementById("theme-toggle"),n=t==="dark"?STR.themeLight:STR.themeDark;b.textContent=n;b.setAttribute("aria-label",n);b.setAttribute("aria-pressed",t==="light"?"true":"false");}
function wireTheme(){
 document.getElementById("theme-toggle").addEventListener("click",function(){
  var n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  try{localStorage.setItem("forma-room-theme",n);}catch(e){}
  themeButton(n);
 });
}

var resizeTimer=null;
function onResize(){
 if(resizeTimer)clearTimeout(resizeTimer);
 resizeTimer=setTimeout(function(){var k=normalize(location.hash);if(VIEWS[k])relayoutAll(VIEWS[k]);},120);
}

function start(){
 document.documentElement.setAttribute("lang",LANG);
 var skip=document.getElementById("skip");skip.textContent=STR.skip;
 skip.addEventListener("click",function(){var m=document.getElementById("content");m.focus();announce(STR.skip);});
 document.getElementById("nav-programs").setAttribute("aria-label",STR.navMain);
 document.getElementById("nav-views").setAttribute("aria-label",STR.navProgram);
 tipEl=document.getElementById("tip");
 document.addEventListener("mousemove",onTip);document.addEventListener("focusin",onTip);
 document.addEventListener("mouseleave",onTip);document.addEventListener("focusout",onTip);
 if(!ROOM){document.getElementById("content").appendChild(el("p","muted",STR.emptyRoom));return;}
 applyTheme();wireTheme();
 document.getElementById("page-title").textContent=ROOM.meta.title||STR.appTitle;
 document.getElementById("page-stamp").textContent=ROOM.meta.today;
 buildAll();buildNav();stampRunningHead();
 window.addEventListener("hashchange",onHash);
 window.addEventListener("resize",onResize);
 // Printing un-hides every view, so every chart must be drawn before the dialog opens.
 var reopened=null;
 window.addEventListener("beforeprint",function(){
  var k,i,d;
  // Captured ONCE per print. Firefox fires this again when a setting changes with the preview open;
  // recapturing then found nothing closed and discarded the real list, so afterprint restored
  // nothing and every evidence row stayed expanded permanently.
  if(reopened===null){
   reopened=[];d=document.querySelectorAll("details:not([open])");
   for(i=0;i<d.length;i++){reopened.push(d[i]);d[i].open=true;}
  }
  for(i=0;i<PRINT_FILL.length;i++)PRINT_FILL[i].fill();
  stampPrintIds();
  for(k in VIEWS)if(VIEWS.hasOwnProperty(k)){VIEWS[k].hidden=false;relayoutAll(VIEWS[k]);}
 });
 window.addEventListener("afterprint",function(){
  if(reopened)for(var i=0;i<reopened.length;i++)reopened[i].open=false;
  reopened=null;
  show(normalize(location.hash));
 });
 onHash();
}
start();
})();
</script>
</body>
