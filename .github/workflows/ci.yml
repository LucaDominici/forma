name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run lint
      - run: npm test
      # dogfood: the product's own gate, on the product. The committed model is deployed to Pages
      # on every push to main — nothing else would notice if it stopped matching the code.
      - run: node bin/forma.mjs check
  ci-required:
    # fail-closed aggregate: one required status check that gates the whole matrix, so branch
    # protection lists a single context instead of one per matrix node version.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    if: always()
    steps:
      - env: { RESULT: "${{ needs.test.result }}" }
        run: |
          echo "test result: $RESULT"
          [ "$RESULT" = success ] || { echo "::error::ci test job did not succeed"; exit 1; }
