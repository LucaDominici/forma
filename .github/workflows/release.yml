name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # 1.0 is a deliberate bootstrap release, already prepared and tagged locally. Do not let a
      # release bot reinterpret its pre-1.0 history as a 0.x release before that tag exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: bootstrap
        run: git tag --list 'v1.*' | grep -q . && echo 'ready=true' >> "$GITHUB_OUTPUT" || true
      - id: release
        if: steps.bootstrap.outputs.ready == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: node
  publish:
    needs: release-please
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Use the supported npm CLI
        run: npm install --global npm@11.16.0
      - name: Assert tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag=$RELEASE_TAG pkg=$PKG"
          test "$RELEASE_TAG" = "$PKG" || { echo "::error::tag $RELEASE_TAG != package version $PKG"; exit 1; }
      - run: npm run lint && npm test
      - run: npm pack --dry-run
      # Trusted publishing (OIDC): no token. The publisher on npmjs.com points at this exact
      # workflow filename, and npm generates provenance for this public repository automatically.
      - run: npm publish
