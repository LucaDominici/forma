name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Assert tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package version $PKG"; exit 1; }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm run lint && npm test
      # Trusted publishing (OIDC): no token. id-token: write (above) + a Trusted Publisher
      # configured on npmjs.com (GitHub Actions -> LucaDominici/forma -> release.yml) authenticate
      # the publish and auto-generate provenance (repo is public). forma-arch's first publish
      # (0.1.0) was bootstrapped manually with a web-auth login + passkey; OIDC covers every
      # release from here. Do NOT re-add NODE_AUTH_TOKEN — npm's 2025 policy broke classic tokens.
      - run: npm publish
