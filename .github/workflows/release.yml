name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Assert tag matches package version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package version $PKG"; exit 1; }
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: npm run lint && npm test
      # First publish uses an NPM_TOKEN (npm trusted publishing / OIDC can only be linked to a
      # package that already exists, so it cannot bootstrap a brand-new package). Once forma-arch
      # exists on npm, switch back to trusted publishing by removing NODE_AUTH_TOKEN and relying on
      # id-token: write + automatic provenance.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
